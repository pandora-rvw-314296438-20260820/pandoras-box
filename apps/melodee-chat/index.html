<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0c"><title>Melodee</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--soft:#18191c;--line:#292b30;--text:#f3f2ef;--muted:#9498a0;--gold:#d4b98a}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}body{min-height:100dvh}.shell{height:100dvh;max-width:860px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;border-inline:1px solid var(--line)}header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:#0b0b0cf2}.brand{display:flex;align-items:center;gap:11px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#242019;border:1px solid #4d4130;color:#ead7b5;font:18px Georgia,serif}.title{font:19px Georgia,serif}.sub{font-size:10px;color:var(--muted);letter-spacing:.09em;margin-top:4px}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#666}.dot.ok{background:#67c587}.dot.busy{background:var(--gold)}.actions button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:7px 9px;margin-left:5px}#messages{overflow:auto;padding:20px 16px 28px}.empty{max-width:520px;margin:18vh auto 0;text-align:center;color:var(--muted)}.empty h1{font:500 34px Georgia,serif;color:var(--text);margin:0 0 9px}.msg{display:flex;margin:12px 0}.msg.user{justify-content:flex-end}.bubble{max-width:78%;padding:11px 13px;border-radius:15px;white-space:pre-wrap;line-height:1.5;font-size:15px;word-break:break-word}.user .bubble{background:#eeeae1;color:#141414;border-bottom-right-radius:5px}.assistant .bubble{background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:5px}.thinking .bubble{color:var(--muted);font-style:italic}.composer-wrap{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.composer{display:flex;align-items:flex-end;gap:9px;border:1px solid #31333a;background:#121316;border-radius:16px;padding:8px 8px 8px 12px}textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;min-height:30px;max-height:150px;padding:6px 0}.send{border:0;width:39px;height:39px;border-radius:12px;background:#eeeae1;color:#111;font-size:19px;font-weight:700}.send:disabled{opacity:.35}.foot{font-size:10px;color:#666;text-align:center;margin-top:7px}.lock{position:fixed;inset:0;background:#09090a;z-index:10;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);border:1px solid var(--line);border-radius:20px;background:#111214;padding:25px}.card h2{font:500 28px Georgia,serif;margin:0 0 8px}.card p{color:var(--muted);line-height:1.5}.card input{width:100%;border:1px solid #34363b;background:#0c0d0f;color:#fff;border-radius:11px;padding:13px;font:inherit}.card button{width:100%;margin-top:10px;border:0;border-radius:11px;background:#eeeae1;color:#111;padding:12px;font-weight:700}.err{min-height:20px;color:#dc8d8d;font-size:12px;margin-top:8px}.hidden{display:none!important}@media(max-width:720px){.shell{border:0}.bubble{max-width:88%}.actions{display:none}.empty{margin-top:14vh}}
</style></head><body>
<div id="lock" class="lock"><div class="card"><div class="avatar">M</div><h2>Melodee</h2><p>Separate private chat connected to the local model on the AWS RDP. Enter the private access phrase once on this device.</p><input id="access" type="password" placeholder="Private access phrase"><button id="unlockBtn">Open chat</button><div id="lockErr" class="err"></div></div></div>
<div class="shell"><header><div class="brand"><div class="avatar">M</div><div><div class="title">Melodee</div><div class="sub">PRIVATE LOCAL CHAT · NOT PANDORA</div></div></div><div style="display:flex;align-items:center;gap:12px"><div class="status"><span id="dot" class="dot"></span><span id="statusText">Checking…</span></div><div class="actions"><button id="clearBtn">Clear</button><button id="lockBtn">Lock</button></div></div></header><main id="messages"></main><div class="composer-wrap"><div class="composer"><textarea id="input" rows="1" placeholder="Message Melodee"></textarea><button id="sendBtn" class="send">↑</button></div><div class="foot">History stays in this browser. Inference runs on the AWS RDP.</div></div></div>
<script>
const LS_KEY='melodee_access_v1',LS_MSG='melodee_messages_v1';let accessKey=localStorage.getItem(LS_KEY)||'',busy=false,messages=[];try{messages=JSON.parse(localStorage.getItem(LS_MSG)||'[]');if(!Array.isArray(messages))messages=[]}catch{messages=[]}const $=id=>document.getElementById(id);function save(){localStorage.setItem(LS_MSG,JSON.stringify(messages.slice(-40)))}function status(t,s=''){$('statusText').textContent=t;$('dot').className='dot '+s}function render(thinking=false){const box=$('messages');box.innerHTML='';if(!messages.length&&!thinking){const e=document.createElement('div');e.className='empty';e.innerHTML='<h1>Talk to Melodee</h1><p>Separate from Pandora. The model and character context run on your AWS RDP.</p>';box.appendChild(e)}for(const m of messages){const r=document.createElement('div');r.className='msg '+m.role;const b=document.createElement('div');b.className='bubble';b.textContent=String(m.content||'');r.appendChild(b);box.appendChild(r)}if(thinking){const r=document.createElement('div');r.className='msg assistant thinking';const b=document.createElement('div');b.className='bubble';b.textContent='Melodee is thinking…';r.appendChild(b);box.appendChild(r)}box.scrollTop=box.scrollHeight}async function api(body){const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json','x-melodee-key':accessKey},body:JSON.stringify(body)});const d=await r.json().catch(()=>({error:'invalid_response'}));if(r.status===401){lockChat();throw new Error('Access phrase rejected')}if(!r.ok)throw new Error(d.detail||d.error||('Request failed '+r.status));return d}async function health(){try{const h=await api({action:'health'});status(h.ok?'RDP connected':'Unavailable',h.ok?'ok':'');return !!h.ok}catch{status('RDP unavailable');return false}}async function unlock(){const v=$('access').value.trim();if(!v)return;$('unlockBtn').disabled=true;$('lockErr').textContent='Checking private RDP…';accessKey=v;try{if(!await health())throw new Error('Could not reach Melodee');localStorage.setItem(LS_KEY,v);$('lock').classList.add('hidden');$('lockErr').textContent='';render();$('input').focus()}catch(e){accessKey='';$('lockErr').textContent=e.message||'Access failed'}finally{$('unlockBtn').disabled=false}}function lockChat(){localStorage.removeItem(LS_KEY);accessKey='';$('access').value='';$('lock').classList.remove('hidden');status('Locked')}async function send(){if(busy)return;const text=$('input').value.trim();if(!text)return;messages.push({role:'user',content:text});save();$('input').value='';resize();busy=true;$('sendBtn').disabled=true;render(true);status('Thinking…','busy');try{const start=await api({action:'start',messages});let done=null;for(let i=0;i<90;i++){await new Promise(r=>setTimeout(r,3000));const s=await api({action:'status',jobId:start.id});if(s.status==='done'){done=s;break}if(s.status==='error')throw new Error(s.error||'Generation failed')}if(!done)throw new Error('Melodee took too long to answer');messages.push({role:'assistant',content:done.response||''});save();status('RDP connected','ok')}catch(e){messages.push({role:'assistant',content:'[Connection error] '+(e.message||'Unable to reach local model')});save();status('Connection issue')}finally{busy=false;$('sendBtn').disabled=false;render();$('input').focus()}}function resize(){const t=$('input');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,150)+'px'}$('unlockBtn').onclick=unlock;$('access').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('sendBtn').onclick=send;$('input').addEventListener('input',resize);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('clearBtn').onclick=()=>{messages=[];save();render()};$('lockBtn').onclick=lockChat;render();if(accessKey){$('lock').classList.add('hidden');health()}
</script></body></html>
