plugins {
    id 'com.android.application'
}

def spirvHeadersDir = System.getenv('SPIRV_HEADERS_DIR') ?: ''
def glslcPath = System.getenv('GLSLC_PATH') ?: ''

android {
    namespace 'com.banataosystems.pandoravulkanbenchmark'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.banataosystems.pandoravulkanbenchmark'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-O3 -std=c++17'
                arguments '-DANDROID_STL=c++_shared',
                          '-DSPIRV-Headers_DIR=' + spirvHeadersDir,
                          '-DVulkan_GLSLC_EXECUTABLE=' + glslcPath
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
    }
}
