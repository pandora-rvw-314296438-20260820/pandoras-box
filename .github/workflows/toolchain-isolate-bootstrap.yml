name: Isolate engineering toolchain package

on:
  push:
    branches:
      - "chore/install-engineering-toolchain-20260907"

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore canonical root dependency graph
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- package.json package-lock.json

      - name: Move toolchain files under tooling
        shell: bash
        run: |
          mkdir -p tooling/scripts tooling/test/e2e
          git mv scripts/verify-engineering-toolchain.mjs tooling/scripts/verify-engineering-toolchain.mjs
          git mv playwright.config.mjs tooling/playwright.config.mjs
          git mv test/e2e/toolchain-smoke.spec.mjs tooling/test/e2e/toolchain-smoke.spec.mjs
          git mv biome.json tooling/biome.json

      - name: Create isolated pinned toolchain
        shell: bash
        run: |
          cat > tooling/package.json <<'JSON'
          {
            "name": "pandora-engineering-toolchain",
            "private": true,
            "version": "1.0.0",
            "engines": {
              "node": ">=24.0.0 <25.0.0"
            },
            "scripts": {
              "verify": "node scripts/verify-engineering-toolchain.mjs",
              "mcp:inspect": "mcp-inspector --cli node ../src/mcp-stdio.js --method tools/list --format json",
              "quality:biome": "biome lint scripts/verify-engineering-toolchain.mjs playwright.config.mjs test/e2e/toolchain-smoke.spec.mjs",
              "playwright:install": "playwright install --with-deps chromium",
              "test:e2e:smoke": "playwright test test/e2e/toolchain-smoke.spec.mjs --config playwright.config.mjs",
              "quality:dead-code": "knip --reporter compact",
              "supabase:version": "supabase --version",
              "vercel:version": "vercel --version",
              "posthog:version": "posthog-cli --version"
            },
            "devDependencies": {
              "@biomejs/biome": "2.5.12",
              "@modelcontextprotocol/inspector": "2.5.0",
              "@playwright/test": "1.63.0",
              "@posthog/cli": "0.18.0",
              "knip": "6.34.0",
              "supabase": "2.116.0",
              "vercel": "59.11.7"
            }
          }
          JSON
          npm install --prefix tooling --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Add root convenience wrappers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.scripts = {
            ...pkg.scripts,
            "tooling:verify": "npm --prefix tooling run verify",
            "mcp:inspect": "npm --prefix tooling run mcp:inspect",
            "quality:biome": "npm --prefix tooling run quality:biome",
            "playwright:install": "npm --prefix tooling run playwright:install",
            "test:e2e:smoke": "npm --prefix tooling run test:e2e:smoke",
            "quality:dead-code": "npm --prefix tooling run quality:dead-code",
            "supabase:version": "npm --prefix tooling run supabase:version",
            "vercel:version": "npm --prefix tooling run vercel:version",
            "posthog:version": "npm --prefix tooling run posthog:version"
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 4) + "\n");
          NODE

      - name: Validate isolated toolchain install
        shell: bash
        run: npm ci --prefix tooling --ignore-scripts --no-audit --no-fund

      - name: Update documentation paths
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const p = "docs/development/ENGINEERING_TOOLCHAIN.md";
          let s = fs.readFileSync(p, "utf8");
          s = s.replace("The root devDependencies pin:", "The isolated `tooling/` package pins:");
          s = s.replace("The root devDependencies", "The isolated `tooling/` package");
          fs.writeFileSync(p, s);
          NODE

      - name: Stage and commit isolated toolchain
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tooling docs/development/ENGINEERING_TOOLCHAIN.md
          git commit -m "chore: isolate engineering toolchain from runtime dependencies"

      - name: Push isolated toolchain commit
        shell: bash
        run: git push origin HEAD

