name: PR186 exact Dart format once

on:
  push:
    branches:
      - codex/polish-pass-2-20260831

permissions:
  contents: read
  id-token: write

jobs:
  format:
    if: startsWith(github.event.head_commit.message, 'chore(ci): bootstrap exact PR186 formatter')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact bootstrap commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Format exact failed files
        shell: bash
        run: |
          set -euo pipefail
          cd apps/pandora-mobile
          dart format \
            lib/features/approvals/approvals_screen.dart \
            lib/features/simple/project_experience_v2.dart
          if git diff --exit-code --quiet -- \
            lib/features/approvals/approvals_screen.dart \
            lib/features/simple/project_experience_v2.dart; then
            echo 'Files were already formatted; nothing to commit.'
            exit 0
          fi

      - name: Commit formatted files through Vault broker
        shell: bash
        env:
          EDGE_URL: https://jcyqixttuebxqqfkjonq.supabase.co/functions/v1/pandora-pr186-format-convergence-20260831
          OIDC_AUDIENCE: pandora-pr186-format-20260831
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          python3 - <<'PY' > /tmp/pr186-format-payload.json
          import base64, json, os, pathlib
          root = pathlib.Path('apps/pandora-mobile')
          paths = [
              'lib/features/approvals/approvals_screen.dart',
              'lib/features/simple/project_experience_v2.dart',
          ]
          files = []
          for rel in paths:
              data = (root / rel).read_bytes()
              files.append({
                  'path': 'apps/pandora-mobile/' + rel,
                  'contentBase64': base64.b64encode(data).decode('ascii'),
              })
          print(json.dumps({'expectedHead': os.environ['GITHUB_SHA'], 'files': files}))
          PY
          curl -fsS -X POST "$EDGE_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/pr186-format-payload.json
