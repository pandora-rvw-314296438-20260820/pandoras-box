name: Recovery Actions write probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-actions-write-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Publish isolated write probe branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="recovery/actions-write-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          mkdir -p recovery/probes
          printf '%s\n' "run_id=${GITHUB_RUN_ID}" "run_attempt=${GITHUB_RUN_ATTEMPT}" "head_sha=${GITHUB_SHA}" > recovery/probes/actions-write-probe.txt
          git add recovery/probes/actions-write-probe.txt
          git commit -m "recovery: prove GitHub Actions branch write"
          git push origin "HEAD:refs/heads/$branch"
          echo "Published probe branch: $branch"
