name: Simple Build Theatre formatter

on:
  push:
    branches:
      - fix/simple-build-theatre-language-20260828

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Materialize exact package context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-format
          mkdir .pandora-mobile-format
          cd .pandora-mobile-format
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
      - name: Format exact Build Theatre file
        shell: bash
        run: |
          set -euo pipefail
          cd .pandora-mobile-format
          dart format lib/features/simple/build_preview_flow.dart
          mkdir -p ../.formatted
          cp lib/features/simple/build_preview_flow.dart ../.formatted/build_preview_flow.dart
      - name: Upload exact formatted file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: simple-build-theatre-formatted-exact-context
          path: .formatted/build_preview_flow.dart
          retention-days: 1
