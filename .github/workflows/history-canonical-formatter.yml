name: History canonical formatter

on:
  push:
    branches:
      - chatgpt/history-ux-79-81-20260903
    paths:
      - .github/workflows/history-canonical-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: chatgpt/history-ux-79-81-20260903
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Format and remove one-shot workflow
        run: |
          dart format apps/pandora-mobile/lib/features/simple/project_history_screen.dart
          git rm .github/workflows/history-canonical-formatter.yml
          git add apps/pandora-mobile/lib/features/simple/project_history_screen.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(history): canonical Flutter format'
          git push origin HEAD:chatgpt/history-ux-79-81-20260903
