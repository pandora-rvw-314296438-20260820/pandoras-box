name: Normalize engineering toolchain artifacts

on:
  push:
    branches:
      - "chore/install-engineering-toolchain-20260907"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format only the new toolchain files
        run: npx biome check --write scripts/verify-engineering-toolchain.mjs playwright.config.mjs test/e2e/toolchain-smoke.spec.mjs

      - name: Regenerate Deno lock for the current package manifest
        run: >
          npx --yes deno-bin@2.2.7 check
          --node-modules-dir=none
          supabase/functions/pandora-owner-api/index.ts
          supabase/functions/pandora-intelligence-chat/index.ts
          supabase/functions/pandora-intelligence-review-attestation/index.ts
          supabase/functions/pandora-project-runtime/index.ts
          supabase/functions/pandora-vercel-runtime-webhook/index.ts
          supabase/functions/pandora-source-convergence-worker/index.ts
          supabase/functions/pandora-project-source-generator/index.ts
          supabase/functions/pandora-project-spec-compiler/index.ts
          supabase/functions/pandora-user-admin/index.ts
          supabase/functions/pandora-worker-dispatch/index.ts
          supabase/functions/pandora-reviewer-attestation/index.ts
          supabase/functions/pandora-release-review-attestation/index.ts
          supabase/functions/pandora-release-owner-authorization/index.ts
          supabase/functions/pandora-physical-android-attestation/index.ts
          supabase/functions/mcpmaster-supabase-control/index.ts

      - name: Verify frozen Edge type-check
        run: npm run check:supabase:types

      - name: Write normalized files to the branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for path in             deno.lock             scripts/verify-engineering-toolchain.mjs             playwright.config.mjs             test/e2e/toolchain-smoke.spec.mjs
          do
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" --jq .sha)"
            encoded="$(base64 -w 0 "$path")"
            gh api               --method PUT               "repos/$GITHUB_REPOSITORY/contents/$path"               -f message="chore: normalize $path"               -f content="$encoded"               -f sha="$current_sha"               -f branch="$GITHUB_REF_NAME"               >/dev/null
          done
