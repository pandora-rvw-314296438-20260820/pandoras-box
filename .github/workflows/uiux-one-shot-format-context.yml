name: One-shot UI format context

on:
  push:
    branches:
      - feature/uiux-master-plan-completion-20260828
    paths:
      - .github/workflows/uiux-one-shot-format-context.yml

permissions:
  contents: write

jobs:
  format-context:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/uiux-master-plan-completion-20260828
          fetch-depth: 0

      - name: Install pinned JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Reproduce exact protected formatting context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create \
            --platforms=android,web \
            --org com.banataosystems \
            --project-name pandora_mobile \
            .
          cp -R ../apps/pandora-mobile/platform/android/. ./android/
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp -R ../apps/pandora-mobile/platform ./platform
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          python3 ../apps/pandora-mobile/tool/configure_validation_android.py \
            android/app/src/main/AndroidManifest.xml
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          dart format \
            lib/features/simple/more_screen.dart \
            lib/features/simple/simple_safety_screen.dart
          cp lib/features/simple/more_screen.dart \
            ../apps/pandora-mobile/lib/features/simple/more_screen.dart
          cp lib/features/simple/simple_safety_screen.dart \
            ../apps/pandora-mobile/lib/features/simple/simple_safety_screen.dart
          cd ..
          rm -rf .pandora-mobile-build
          rm .github/workflows/uiux-one-shot-format-context.yml
          git diff --check
          git config user.name 'pandora-rvw-314296438-20260820'
          git config user.email 'plpboracay@gmail.com'
          git add \
            apps/pandora-mobile/lib/features/simple/more_screen.dart \
            apps/pandora-mobile/lib/features/simple/simple_safety_screen.dart \
            .github/workflows/uiux-one-shot-format-context.yml
          git commit -m 'style(ui): match protected Flutter validation formatter'
          git push origin HEAD:feature/uiux-master-plan-completion-20260828
