name: Chat D package-context formatter workbench

on:
  push:
    branches:
      - chat-d/formatter-workbench-20260901

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: chat-d/visible-code-theatre-foundation-20260901
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Resolve exact mobile lockfile
        working-directory: apps/pandora-mobile
        run: |
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
      - name: Apply package-context Dart formatter
        working-directory: apps/pandora-mobile
        run: dart format lib/features/simple/live_build_theatre test/features/simple/live_build_theatre
      - name: Commit exact formatter output
        run: |
          set -euo pipefail
          git config user.name "pandora-rvw-314296438-20260820"
          git config user.email "plpboracay@gmail.com"
          git add apps/pandora-mobile/lib/features/simple/live_build_theatre apps/pandora-mobile/test/features/simple/live_build_theatre
          if git diff --cached --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git commit -m "chore(mobile): apply package-context Dart format"
          git push origin HEAD:chat-d/visible-code-theatre-foundation-20260901
