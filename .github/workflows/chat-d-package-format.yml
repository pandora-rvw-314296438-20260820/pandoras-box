name: Chat D package-context formatter workbench

on:
  push:
    branches:
      - chat-d/formatter-workbench-20260901
    paths:
      - .github/workflows/chat-d-package-format.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Resolve exact mobile lockfile
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
      - name: Apply package-context Dart formatter
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/simple/live_build_theatre/live_build_code_view.dart \
            lib/features/simple/live_build_theatre/live_build_event.dart \
            lib/features/simple/live_build_theatre/live_build_file_activity.dart \
            lib/features/simple/live_build_theatre/live_build_reducer.dart \
            test/features/simple/live_build_theatre/live_build_code_view_test.dart \
            test/features/simple/live_build_theatre/live_build_reducer_test.dart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chat-d-package-formatted-source
          path: |
            apps/pandora-mobile/lib/features/simple/live_build_theatre
            apps/pandora-mobile/test/features/simple/live_build_theatre
          if-no-files-found: error
          retention-days: 1
