name: Temporary Pandora UI formatter artifact

on:
  push:
    branches:
      - fix/canonical-working-ui-screenshot-fidelity-20260826
    paths:
      - apps/pandora-mobile/lib/**/*.dart
      - .github/workflows/pandora-ui-format-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: false

      - name: Format corrected Pandora source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            apps/pandora-mobile/lib/app/pandora_shell.dart \
            apps/pandora-mobile/lib/features/simple/simple_home_screen.dart \
            apps/pandora-mobile/lib/features/simple/ask_pandora_screen.dart \
            apps/pandora-mobile/lib/features/simple/build_preview_flow.dart \
            apps/pandora-mobile/lib/features/simple/pandora_simple_ui.dart
          tar -czf /tmp/pandora-ui-formatted.tar.gz \
            apps/pandora-mobile/lib/app/pandora_shell.dart \
            apps/pandora-mobile/lib/features/simple/simple_home_screen.dart \
            apps/pandora-mobile/lib/features/simple/ask_pandora_screen.dart \
            apps/pandora-mobile/lib/features/simple/build_preview_flow.dart \
            apps/pandora-mobile/lib/features/simple/pandora_simple_ui.dart
          sha256sum /tmp/pandora-ui-formatted.tar.gz > /tmp/pandora-ui-formatted.sha256

      - name: Upload formatted exact-source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pandora-ui-formatted-${{ github.sha }}
          path: |
            /tmp/pandora-ui-formatted.tar.gz
            /tmp/pandora-ui-formatted.sha256
          if-no-files-found: error
          retention-days: 1
