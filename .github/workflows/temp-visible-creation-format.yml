name: Temporary visible creation formatter

on:
  push:
    branches:
      - visible-creation/final-convergence-20260902

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: visible-creation/final-convergence-20260902
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Format exact changed Dart sources
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            apps/pandora-mobile/lib/core/data/project_experience_api.dart \
            apps/pandora-mobile/lib/core/data/project_experience_repository.dart \
            apps/pandora-mobile/lib/features/simple/project_experience_v2.dart \
            apps/pandora-mobile/lib/features/simple/project_workspace_v2_view.dart
      - name: Commit canonical formatter result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/pandora-mobile/lib/core/data/project_experience_api.dart \
            apps/pandora-mobile/lib/core/data/project_experience_repository.dart \
            apps/pandora-mobile/lib/features/simple/project_experience_v2.dart \
            apps/pandora-mobile/lib/features/simple/project_workspace_v2_view.dart
          git commit -m 'style: format final visible creation convergence'
          git push origin HEAD:visible-creation/final-convergence-20260902
