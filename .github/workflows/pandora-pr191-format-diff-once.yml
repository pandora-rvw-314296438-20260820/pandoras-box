name: PR191 exact formatter diff once

on:
  push:
    branches:
      - feature/experience-projection-mobile-v1

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FLUTTER_VERSION: '3.47.0'
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Reproduce official mobile format context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-format-context
          mkdir .pandora-format-context
          cp -R apps/pandora-mobile/lib .pandora-format-context/lib
          cp -R apps/pandora-mobile/test .pandora-format-context/test
          cp apps/pandora-mobile/pubspec.yaml .pandora-format-context/pubspec.yaml
          cp apps/pandora-mobile/pubspec.lock .pandora-format-context/pubspec.lock
          cp apps/pandora-mobile/analysis_options.yaml .pandora-format-context/analysis_options.yaml
          cd .pandora-format-context
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          dart format lib test
          cp lib/features/simple/project_experience_v2.dart \
            ../apps/pandora-mobile/lib/features/simple/project_experience_v2.dart
          cd ..
          echo '--- BEGIN CANONICAL DART FORMAT DIFF ---'
          git diff -- apps/pandora-mobile/lib/features/simple/project_experience_v2.dart
          echo '--- END CANONICAL DART FORMAT DIFF ---'
          test -n "$(git diff -- apps/pandora-mobile/lib/features/simple/project_experience_v2.dart)"
          test -z "$(git status --short --untracked-files=no | grep -v 'apps/pandora-mobile/lib/features/simple/project_experience_v2.dart' || true)"
