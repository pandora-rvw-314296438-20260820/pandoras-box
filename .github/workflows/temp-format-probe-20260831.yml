name: Temporary Dart format probe

on:
  push:
    branches:
      - codex/format-probe-20260831

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out probe source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Canonically format changed Dart files
        working-directory: apps/pandora-mobile
        run: |
          dart format \
            lib/core/data/project_experience_api.dart \
            lib/features/diagnostics/developer_diagnostics_screen.dart \
            lib/features/simple/project_experience_v2.dart
      - name: Upload canonical formatter output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pandora-canonical-dart-format-20260831
          path: |
            apps/pandora-mobile/lib/core/data/project_experience_api.dart
            apps/pandora-mobile/lib/features/diagnostics/developer_diagnostics_screen.dart
            apps/pandora-mobile/lib/features/simple/project_experience_v2.dart
          retention-days: 1
