name: Canonical release evidence

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-release-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-contract:
    name: canonical-release-source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove the checkout is exact and clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Use the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install the locked dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify the source-only release contract
        run: node scripts/verify-canonical-release-evidence.mjs --mode repository

      - name: Run focused release-contract tests
        run: node --test test/canonical-release-evidence.test.js

      - name: Gate owner audit-to-build release journey
        run: node --test test/pandora-owner-journey-release-gate.test.js

      - name: Run the complete repository check
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run check

      - name: Run every repository test
        if: ${{ github.event_name != 'pull_request' }}
        run: npm test

      - name: Audit production dependencies
        if: ${{ github.event_name != 'pull_request' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check all governed Edge functions in isolation
        if: ${{ github.event_name != 'pull_request' }}
        run: npx --yes deno-bin@2.2.7 check --node-modules-dir=none --frozen supabase/functions/pandora-owner-api/index.ts supabase/functions/pandora-coordinator-gate/index.ts supabase/functions/pandora-worker-dispatch/index.ts supabase/functions/pandora-reviewer-attestation/index.ts supabase/functions/pandora-release-review-attestation/index.ts supabase/functions/pandora-release-owner-authorization/index.ts supabase/functions/pandora-physical-android-attestation/index.ts supabase/functions/mcpmaster-supabase-control/index.ts

      - name: Re-prove the checkout before binding it
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Emit source-only SHA, tree, and migration binding
        run: >-
          node scripts/verify-canonical-release-evidence.mjs
          --mode source-binding
          --expected-sha "$EXPECTED_SOURCE_SHA"
          --output "${{ runner.temp }}/canonical-release-source-binding.json"

      - name: Upload the source-only binding
        if: ${{ !github.event.repository.private }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-release-source-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-release-source-binding.json
          if-no-files-found: error
          retention-days: 30

      - name: Record private source-only binding
        if: ${{ github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          binding="${{ runner.temp }}/canonical-release-source-binding.json"
          test -s "$binding"
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          binding_sha256="$(sha256sum "$binding" | cut -d ' ' -f1)"
          [[ "$binding_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'PANDORA_PRIVATE_SOURCE_BINDING source_sha=%s source_tree=%s binding_sha256=%s release_authority=false artifact_provider=unavailable\n' \
            "$source_sha" "$source_tree" "$binding_sha256"
          {
            echo '### Private source-binding receipt'
            echo "- Source SHA: $source_sha"
            echo "- Source tree: $source_tree"
            echo "- Binding SHA-256: $binding_sha256"
            echo '- Release authority: `false` (GitHub artifact provider unavailable)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm candidate CI did not mutate source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
