name: Pandora mobile canonical formatter

on:
  push:
    branches:
      - fix/canonical-working-ui-screenshot-fidelity-20260826
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pandora-mobile-ui-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Apply canonical Dart formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FLUTTER_VERSION: '3.47.0'
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Format corrected mobile source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            apps/pandora-mobile/lib/features/auth/auth_gate.dart \
            apps/pandora-mobile/lib/features/simple/simple_home_screen.dart \
            apps/pandora-mobile/lib/features/simple/ask_pandora_screen.dart

      - name: Commit formatter output when needed
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            apps/pandora-mobile/lib/features/auth/auth_gate.dart
            apps/pandora-mobile/lib/features/simple/simple_home_screen.dart
            apps/pandora-mobile/lib/features/simple/ask_pandora_screen.dart
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Source is already canonically formatted."
            exit 0
          fi
          git config user.name pandora-rvw-314296438-20260820
          git config user.email plpboracay@gmail.com
          git add -- "${paths[@]}"
          git commit -m "style(mobile): apply canonical Dart formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
