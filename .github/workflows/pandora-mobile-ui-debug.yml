name: Pandora mobile UI diagnostic

on:
  push:
    branches:
      - fix/canonical-working-ui-screenshot-fidelity-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pandora-mobile-ui-debug-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Focused Flutter widget diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLUTTER_VERSION: '3.47.0'
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Materialize test workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-debug
          mkdir .pandora-mobile-debug
          cd .pandora-mobile-debug
          flutter create --platforms=web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          flutter pub get --enforce-lockfile

      - name: Run focused tests and preserve output
        id: focused_tests
        working-directory: .pandora-mobile-debug
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test test/app/pandora_shell_test.dart --reporter expanded 2>&1 | tee widget-test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload diagnostic output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pandora-mobile-ui-debug-${{ github.sha }}
          path: .pandora-mobile-debug/widget-test-output.txt
          if-no-files-found: error
          retention-days: 3

      - name: Fail when focused tests fail
        if: ${{ steps.focused_tests.outputs.exit_code != '0' }}
        shell: bash
        run: exit 1
