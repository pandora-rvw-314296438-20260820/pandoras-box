name: Exact full mobile materialized formatter

on:
  push:
    branches:
      - feature/professional-build-plan-20260901
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/professional-build-plan-20260901
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Format the exact full mobile gate scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir -p .pandora-mobile-build
          cp -R apps/pandora-mobile/lib .pandora-mobile-build/lib
          cp -R apps/pandora-mobile/test .pandora-mobile-build/test
          cp apps/pandora-mobile/pubspec.yaml .pandora-mobile-build/pubspec.yaml
          cp apps/pandora-mobile/analysis_options.yaml .pandora-mobile-build/analysis_options.yaml
          cd .pandora-mobile-build
          dart format lib test
          cd ..
          rm -rf apps/pandora-mobile/lib apps/pandora-mobile/test
          cp -R .pandora-mobile-build/lib apps/pandora-mobile/lib
          cp -R .pandora-mobile-build/test apps/pandora-mobile/test
          if git diff --quiet --exit-code -- apps/pandora-mobile/lib apps/pandora-mobile/test; then
            echo 'No full-scope formatter changes required.'
            exit 0
          fi
          git config user.name 'pandora-rvw-314296438-20260820'
          git config user.email 'plpboracay@gmail.com'
          git add apps/pandora-mobile/lib apps/pandora-mobile/test
          git commit -m 'style(mobile): normalize exact mobile gate format scope'
          git push origin HEAD:feature/professional-build-plan-20260901
