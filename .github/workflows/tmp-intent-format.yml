name: Temporary exact intent formatter

on:
  push:
    branches:
      - feature/pandora-intent-distillation-20260901

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/pandora-intent-distillation-20260901
          fetch-depth: 0

      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Format changed mobile sources
        shell: bash
        run: |
          set -euo pipefail
          dart --version
          dart format \
            apps/pandora-mobile/lib/core/data/project_experience_api.dart \
            apps/pandora-mobile/lib/core/data/project_experience_repository.dart \
            apps/pandora-mobile/lib/core/models/project_journey_models.dart \
            apps/pandora-mobile/lib/features/simple/project_create_experience.dart \
            apps/pandora-mobile/lib/features/simple/project_build_conversation.dart \
            apps/pandora-mobile/lib/features/simple/project_experience_v2.dart
          git add \
            apps/pandora-mobile/lib/core/data/project_experience_api.dart \
            apps/pandora-mobile/lib/core/data/project_experience_repository.dart \
            apps/pandora-mobile/lib/core/models/project_journey_models.dart \
            apps/pandora-mobile/lib/features/simple/project_create_experience.dart \
            apps/pandora-mobile/lib/features/simple/project_build_conversation.dart \
            apps/pandora-mobile/lib/features/simple/project_experience_v2.dart
          if git diff --cached --quiet; then
            echo 'Exact formatter produced no changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply exact Flutter 3.47.0 formatter'
          git push origin HEAD:feature/pandora-intent-distillation-20260901
