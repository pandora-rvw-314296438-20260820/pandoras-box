name: Temporary repository test diagnostics

on:
  push:
    branches:
      - feature/pandora-intent-distillation-20260901

permissions:
  contents: read

jobs:
  diagnose-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build repository
        run: npm run build
      - name: Root tests
        shell: bash
        run: |
          set +e
          for file in test/*.test.js; do
            node --test "$file" > /tmp/root-test.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error title=Root test failed::$file"
              grep -E 'not ok|AssertionError|ERR_|actual:|expected:|operator:|at .*test/' /tmp/root-test.log | head -n 20 | while IFS= read -r line; do
                echo "::error title=Root test detail::$line"
              done
              exit "$status"
            fi
          done
          exit 0
      - name: Meta tests
        run: node --test apps/meta-business-mcp/test/*.test.js
      - name: Shared security tests
        run: node --test packages/shared-security/test/*.test.js
      - name: Pandora tools tests
        run: node --test packages/pandora-tools/test/*.test.js
      - name: Pandora integration tests
        run: node --test packages/pandora-integration/test/*.test.mjs
      - name: Worker tests
        run: npm run test:worker
