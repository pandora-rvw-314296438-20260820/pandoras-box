name: Export exact Pandora APK

on:
  push:
    branches:
      - artifact/export-apk-e47b0be4-20260901

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download exact Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             /repos/${{ github.repository }}/actions/artifacts/9781627425/zip             > artifact.zip
          test "$(stat -c %s artifact.zip)" = "75704222"

      - name: Extract exact APK
        run: |
          set -euo pipefail
          unzip -p artifact.zip build/app/outputs/flutter-apk/app-debug.apk > Pandora-Live-Code-e47b0be4.apk
          test "$(stat -c %s Pandora-Live-Code-e47b0be4.apk)" = "156474674"
          sha256sum Pandora-Live-Code-e47b0be4.apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if ! out=$(gh release upload pandora-live-code-e47b0be4             Pandora-Live-Code-e47b0be4.apk             --clobber             --repo "${{ github.repository }}" 2>&1); then
            echo "::error::$out"
            exit 1
          fi
          echo "$out"
