name: Recover canonical MCPMaster source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'recovery/mcpmaster-source.part-*'
      - 'recovery/SOURCE_RECOVERY_MANIFEST.md'
      - '.github/workflows/recover-canonical-source.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate recovery parts
        shell: bash
        run: |
          set -euo pipefail
          test -s recovery/mcpmaster-source.part-00
          test -s recovery/mcpmaster-source.part-01
          test -s recovery/mcpmaster-source.part-02
          test -s recovery/mcpmaster-source.part-03
          wc -c recovery/mcpmaster-source.part-*
      - name: Reassemble and verify recovery snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat recovery/mcpmaster-source.part-* > /tmp/mcpmaster-recovery-source.zip
          echo "dd7a4d1f982698bfe008f376809253011e8436598860bd86600c17e31538af83  /tmp/mcpmaster-recovery-source.zip" | sha256sum -c -
          rm -rf /tmp/mcpmaster-recovery
          mkdir -p /tmp/mcpmaster-recovery
          unzip -q /tmp/mcpmaster-recovery-source.zip -d /tmp/mcpmaster-recovery
      - name: Overlay missing recovered source without replacing newer canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --ignore-existing --exclude '.github/' --exclude 'README.md' /tmp/mcpmaster-recovery/source/ ./
          test -f SOURCE_AUTHORITY_POLICY.json
          test -f package.json
          test -f src/http-server.ts
      - name: Publish recovered source to protected-review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="recovery/canonical-source-restored-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to publish."
            exit 0
          fi
          git commit -m "recovery: restore canonical MCPMaster source snapshot"
          git push origin "HEAD:refs/heads/$branch"
          echo "Published recovered source branch: $branch"
