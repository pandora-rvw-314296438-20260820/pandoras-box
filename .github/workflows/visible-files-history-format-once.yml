name: Visible Files History Format Once

on:
  push:
    branches:
      - visible/files-history-memory-closure-20260902

permissions:
  contents: write

jobs:
  format-once:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: visible/files-history-memory-closure-20260902
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Canonical format and self-remove
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/pandora-mobile/lib/features/simple/project_source_files_screen.dart apps/pandora-mobile/lib/features/simple/project_history_screen.dart
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/pandora-mobile/lib/features/simple/project_source_files_screen.dart apps/pandora-mobile/lib/features/simple/project_history_screen.dart
          git rm .github/workflows/visible-files-history-format-once.yml
          git commit -m 'Apply canonical Dart formatting to Files and History'
          git push origin HEAD:visible/files-history-memory-closure-20260902
