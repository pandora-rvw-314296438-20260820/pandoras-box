name: PR186 exact visual baseline refresh once

on:
  push:
    branches:
      - codex/polish-pass-2-20260831

permissions:
  contents: read
  id-token: write

jobs:
  goldens:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Materialize exact validation project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          cp -R ../apps/pandora-mobile/platform/android/. ./android/
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp -R ../apps/pandora-mobile/platform ./platform
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock

      - name: Regenerate exact golden baselines
        shell: bash
        run: |
          set -euo pipefail
          cd .pandora-mobile-build
          flutter test --update-goldens test/goldens
          cd ..
          while IFS= read -r -d '' file; do
            rel="${file#.pandora-mobile-build/test/goldens/}"
            target="apps/pandora-mobile/test/goldens/$rel"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < <(find .pandora-mobile-build/test/goldens -type f -name '*.png' ! -path '*/failures/*' -print0)

      - name: Prove Flutter tests with refreshed baselines
        shell: bash
        run: |
          set -euo pipefail
          cd .pandora-mobile-build
          flutter test --reporter expanded

      - name: Commit changed golden PNGs through Vault broker
        shell: bash
        env:
          EDGE_URL: https://jcyqixttuebxqqfkjonq.supabase.co/functions/v1/pandora-pr186-golden-convergence-20260831
          OIDC_AUDIENCE: pandora-pr186-goldens-20260831
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(jq -r .value <<<"$OIDC_JSON")"
          mapfile -t files < <(git status --porcelain --untracked-files=all apps/pandora-mobile/test/goldens | awk '{print $2}' | grep -E '\.png$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No golden PNG changes detected.'
            exit 1
          fi
          : > /tmp/entries.ndjson
          for path in "${files[@]}"; do
            content="$(base64 -w0 "$path")"
            jq -n --arg action blob --arg expectedHead "$GITHUB_SHA" --arg path "$path" --arg contentBase64 "$content" '{action:$action,expectedHead:$expectedHead,path:$path,contentBase64:$contentBase64}' > /tmp/blob.json
            response="$(curl -fsS -X POST "$EDGE_URL" -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/blob.json)"
            sha="$(jq -r .blobSha <<<"$response")"
            test "${#sha}" -eq 40
            jq -n --arg path "$path" --arg sha "$sha" '{path:$path,sha:$sha}' >> /tmp/entries.ndjson
          done
          jq -s '.' /tmp/entries.ndjson > /tmp/entries.json
          jq -n --arg action commit --arg expectedHead "$GITHUB_SHA" --slurpfile entries /tmp/entries.json '{action:$action,expectedHead:$expectedHead,entries:$entries[0]}' > /tmp/commit.json
          curl -fsS -X POST "$EDGE_URL" -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/commit.json
