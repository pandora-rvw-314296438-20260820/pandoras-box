name: Temporary Flutter test diagnostics

on:
  push:
    branches:
      - feature/pandora-intent-distillation-20260901

permissions:
  contents: read

jobs:
  diagnose-flutter-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Resolve exact lockfile
        working-directory: apps/pandora-mobile
        run: flutter pub get --enforce-lockfile
      - name: Flutter test diagnostic
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > /tmp/flutter-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE 'Expected:|Actual:|Which:|Test failed|Some tests failed|test/[^ ]*\\.dart|══╡|Failure|Exception|FAILED|failed' /tmp/flutter-test.log | tail -n 60 | while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              echo "::error title=Flutter test::${escaped}"
            done
          fi
          exit "$status"
