name: One-shot UI formatter

on:
  push:
    branches:
      - feature/uiux-master-plan-completion-20260828
    paths:
      - .github/workflows/uiux-one-shot-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/uiux-master-plan-completion-20260828
          fetch-depth: 0

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Format exact UI files and remove formatter workflow
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            apps/pandora-mobile/lib/features/simple/more_screen.dart \
            apps/pandora-mobile/lib/features/simple/simple_safety_screen.dart
          rm .github/workflows/uiux-one-shot-format.yml
          git diff --check
          git config user.name 'pandora-rvw-314296438-20260820'
          git config user.email 'plpboracay@gmail.com'
          git add \
            apps/pandora-mobile/lib/features/simple/more_screen.dart \
            apps/pandora-mobile/lib/features/simple/simple_safety_screen.dart \
            .github/workflows/uiux-one-shot-format.yml
          git commit -m 'style(ui): apply Flutter 3.47 formatter'
          git push origin HEAD:feature/uiux-master-plan-completion-20260828
