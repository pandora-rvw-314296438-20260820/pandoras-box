name: Pandora CI Governance

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      target:
        description: Select the governance workflow to run manually
        required: true
        type: choice
        default: none
        options:
          - 'none'
          - 'all'
          - 'dependency-review'
          - 'pandora-audit-behavior'
          - 'pandora-artifact-retention'
          - 'kimi-evaluation-verification'
  schedule:
    - cron: '17 */6 * * *'
  workflow_run:
    workflows:
      - Pandora mobile exact-source gate
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-governance-${{ github.event.pull_request.number || github.ref || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  detect_scopes:
    name: Detect governance test scopes
    runs-on: ubuntu-24.04
    outputs:
      dependency_review: ${{ steps.detect.outputs.dependency_review }}
      pandora_audit_behavior: ${{ steps.detect.outputs.pandora_audit_behavior }}
      pandora_artifact_retention: ${{ steps.detect.outputs.pandora_artifact_retention }}
      kimi_evaluation_verification: ${{ steps.detect.outputs.kimi_evaluation_verification }}
    steps:
      - name: Check out source for path comparison
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Resolve governance job scopes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
          PUSH_BRANCH: ${{ github.ref_name }}
          TARGET: ${{ github.event.inputs.target || 'none' }}
          SCOPE_CONFIG: |
            {"dependency-review":{"pull_request":{"present":true,"paths":null,"pathsIgnore":null,"branches":["main"],"branchesIgnore":null},"push":{"present":false},"merge_group":{"present":true,"paths":null,"pathsIgnore":null,"branches":null,"branchesIgnore":null},"workflow_dispatch":{"present":false},"schedule":{"present":false},"workflow_run":{"present":false}},"pandora-audit-behavior":{"pull_request":{"present":true,"paths":["supabase/migrations/**","test/sql/audit-security-*.sql","test/audit-final-migration-order.test.js","apps/pandora-mobile/lib/features/enterprise/plp/local_ai/plp_chat_fallback.dart","apps/pandora-mobile/test/features/enterprise/plp/local_ai/plp_*test.dart","apps/pandora-mobile/lib/features/enterprise/eurofish/data/eurofish_workspace_api.dart","apps/pandora-mobile/test/features/enterprise/eurofish/data/eurofish_workspace_api_test.dart",".github/workflows/ci-governance.yml"],"pathsIgnore":null,"branches":null,"branchesIgnore":null},"push":{"present":false},"merge_group":{"present":false},"workflow_dispatch":{"present":true,"paths":null,"pathsIgnore":null,"branches":null,"branchesIgnore":null},"schedule":{"present":false},"workflow_run":{"present":false}},"pandora-artifact-retention":{"pull_request":{"present":false},"push":{"present":true,"paths":null,"pathsIgnore":null,"branches":["main"],"branchesIgnore":null},"merge_group":{"present":false},"workflow_dispatch":{"present":true,"paths":null,"pathsIgnore":null,"branches":null,"branchesIgnore":null},"schedule":{"present":true,"paths":null,"pathsIgnore":null,"branches":null,"branchesIgnore":null},"workflow_run":{"present":true,"paths":null,"pathsIgnore":null,"branches":null,"branchesIgnore":null}},"kimi-evaluation-verification":{"pull_request":{"present":true,"paths":["packages/pandora-intelligence/**","packages/pandora-verification/**","test/pandora-model-provider-verification.test.js",".github/workflows/ci-governance.yml"],"pathsIgnore":null,"branches":null,"branchesIgnore":null},"push":{"present":true,"paths":["packages/pandora-intelligence/**","packages/pandora-verification/**","test/pandora-model-provider-verification.test.js",".github/workflows/ci-governance.yml"],"pathsIgnore":null,"branches":["main"],"branchesIgnore":null},"merge_group":{"present":false},"workflow_dispatch":{"present":true,"paths":null,"pathsIgnore":null,"branches":null,"branchesIgnore":null},"schedule":{"present":false},"workflow_run":{"present":false}}}
        run: |
          python3 - <<'PY'
          import fnmatch,json,os,subprocess
          cfg=json.loads(os.environ["SCOPE_CONFIG"]);event=os.environ["EVENT_NAME"];target=os.environ.get("TARGET","none")
          head=os.environ["HEAD_SHA"];before=os.environ.get("BEFORE_SHA","");base=os.environ.get("BASE_SHA","")
          branch=os.environ.get("BASE_BRANCH" if event=="pull_request" else "PUSH_BRANCH","")
          def diff_files(*args):
              r=subprocess.run(["git","diff","--name-only",*args],capture_output=True,text=True);return set(x for x in r.stdout.splitlines() if x) if r.returncode==0 else set()
          if event in ("pull_request","merge_group") and base:changed=diff_files(base,head)
          elif event=="push" and before and set(before)!={"0"}:changed=diff_files(before,head)
          elif event=="push":
              r=subprocess.run(["git","diff-tree","--no-commit-id","--name-only","-r",head],capture_output=True,text=True);changed=set(r.stdout.splitlines())
          else:changed=set()
          def matches(v,ps):
              state=False
              for p in ps:
                  if p.startswith("!"):
                      if fnmatch.fnmatchcase(v,p[1:]):state=False
                  elif fnmatch.fnmatchcase(v,p):state=True
              return state
          def scope(n,s):
              spec=s.get(event,{"present":False})
              if event=="workflow_dispatch":return spec.get("present",False) and target not in ("none","") and (target=="all" or target==n)
              if not spec.get("present"):return False
              if event in ("pull_request","push","merge_group"):
                  allow=spec.get("branches")
                  if allow is not None and not any(fnmatch.fnmatchcase(branch,p) for p in allow if not p.startswith("!")):return False
                  if allow is not None and any(p.startswith("!") and fnmatch.fnmatchcase(branch,p[1:]) for p in allow):return False
                  if any(fnmatch.fnmatchcase(branch,p) for p in (spec.get("branchesIgnore") or [])):return False
                  pats=spec.get("paths");ignored=spec.get("pathsIgnore")
                  if pats is not None:return any(matches(f,pats) for f in changed)
                  if ignored:return not any(matches(f,ignored) for f in changed)
                  return True
              return event in ("schedule","workflow_run")
          vals=[n.replace("-","_")+"="+("true" if scope(n,s) else "false") for n,s in cfg.items()]
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:f.write("\n".join(vals)+"\n")
          print("Changed paths:",len(changed));print("\n".join(vals))
          PY

  gov_dependency_dependency-review:
    permissions:
      pull-requests: read
    needs: detect_scopes
    if: ${{ needs.detect_scopes.outputs.dependency_review == 'true' }}
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect pull-request dependency manifest changes
        if: ${{ github.event_name == 'pull_request' }}
        id: scope
        shell: bash
        env:
          INTEGRATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git rev-parse "$INTEGRATION_SHA^1" >/dev/null
          git rev-parse "$INTEGRATION_SHA^2" >/dev/null
          git diff --name-only "$INTEGRATION_SHA^1" "$INTEGRATION_SHA^2" > "$RUNNER_TEMP/gov_dependency_dependency-review-files.txt"
          if grep -Eq '(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|pubspec\.ya?ml|pubspec\.lock|requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|Pipfile(\.lock)?|go\.(mod|sum)|Cargo\.(toml|lock)|Gemfile(\.lock)?|composer\.(json|lock))$' "$RUNNER_TEMP/gov_dependency_dependency-review-files.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review public repository dependency changes
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.changed == 'true' && !github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Use Node 24 for private or merge-queue dependency audit
        if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && steps.scope.outputs.changed == 'true' && github.event.repository.private) }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Audit locked dependency state
        if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && steps.scope.outputs.changed == 'true' && github.event.repository.private) }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run audit:prod
          npm ci --prefix tooling --ignore-scripts --no-audit --no-fund
          npm run tooling:audit

      - name: Confirm no dependency review is required
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.changed != 'true' }}
        run: echo "No dependency manifests or lockfiles changed in this pull request."


  gov_audit_authorization:
    needs: detect_scopes
    if: ${{ needs.detect_scopes.outputs.pandora_audit_behavior == 'true' }}
    name: Audit / PostgreSQL gov_audit_authorization behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: pandora_audit_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: pandora_audit_fixture
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run fixture, actual migrations, and denial behavior
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f test/sql/audit-security-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260925054238_pandora_fail_closed_membership_guards_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260925054517_pandora_provider_tenant_binding_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f test/sql/audit-security-behavior.sql
          psql -X -v ON_ERROR_STOP=1 -f test/sql/audit-security-trigger-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260925062441_pandora_tax_internal_trigger_execute_boundary.sql
          psql -X -v ON_ERROR_STOP=1 -f test/sql/audit-security-trigger-behavior.sql
          node --test test/audit-final-migration-order.test.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('supabase/migrations/20260925063000_pandora_meta_native_capability_v1.sql').read_text()
          match = re.search(r'CREATE\s+OR\s+REPLACE\s+FUNCTION\s+public\.pandora_chat_capability_dispatch_native_v1\b', source, re.I)
          assert match, 'Actual late native dispatcher definition missing'
          tail = source[match.start():]
          opener = re.search(r'\bAS\s+(\$[A-Za-z_0-9]*\$)', tail, re.I)
          assert opener, 'Function body delimiter missing'
          end = tail.index(opener.group(1), opener.end()) + len(opener.group(1))
          definition = tail[:end] + ';\n'
          Path('/tmp/late-dispatcher.sql').write_text('CREATE TYPE extensions.http_response AS (status integer, content_type text, headers text[], content text);\n' + definition + '\nGRANT EXECUTE ON FUNCTION public.pandora_chat_capability_dispatch_native_v1(uuid,text,uuid,uuid) TO authenticated;\n')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/late-dispatcher.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260925090001_pandora_authorization_replay_finalizer.sql
          psql -X -v ON_ERROR_STOP=1 -f test/sql/audit-security-final-behavior.sql
          psql -X -v ON_ERROR_STOP=1 -f test/sql/audit-security-trigger-behavior.sql

  gov_audit_business-data:
    needs: detect_scopes
    if: ${{ needs.detect_scopes.outputs.pandora_audit_behavior == 'true' }}
    name: Audit / PLP missing-data behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Run actual fallback behavioral tests
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub lib/features/enterprise/plp/local_ai/plp_chat_fallback.dart test/features/enterprise/plp/local_ai/plp_missing_data_test.dart lib/features/enterprise/eurofish/data/eurofish_workspace_api.dart test/features/enterprise/eurofish/data/eurofish_workspace_api_test.dart
          flutter test --no-pub test/features/enterprise/plp/local_ai/plp_chat_fallback_test.dart test/features/enterprise/plp/local_ai/plp_missing_data_test.dart test/features/enterprise/eurofish/data/eurofish_workspace_api_test.dart


  gov_retention_prune:
    permissions:
      actions: write
    needs: detect_scopes
    if: ${{ needs.detect_scopes.outputs.pandora_artifact_retention == 'true' }}
    name: Prune expired validation artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MAX_DELETIONS: '250'
    steps:
      - name: Delete only expired or superseded Web validation artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          main_sha="$(gh api "repos/${repo}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]

          inventory="${RUNNER_TEMP}/pandora-artifacts.tsv"
          gh api --paginate "repos/${repo}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id,.name,.expired,.size_in_bytes,.created_at,(.workflow_run.head_sha // "")] | @tsv' \
            > "$inventory"

          deleted=0
          reclaimed=0
          while IFS=$'\t' read -r id name expired size created_at head_sha; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || continue
            [[ "$size" =~ ^[0-9]+$ ]] || continue

            delete=false
            reason=''
            if [[ "$expired" == 'true' ]]; then
              delete=true
              reason='expired'
            elif [[ "$name" == 'pandora-mobile-web-validation' && "$head_sha" != "$main_sha" ]]; then
              delete=true
              reason='superseded-web-validation'
            fi

            if [[ "$delete" != 'true' ]]; then
              continue
            fi
            if (( deleted >= MAX_DELETIONS )); then
              echo "Deletion cap reached: ${MAX_DELETIONS}"
              break
            fi

            echo "Deleting artifact id=${id} name=${name} size=${size} reason=${reason} created=${created_at}"
            gh api -X DELETE "repos/${repo}/actions/artifacts/${id}"
            deleted=$((deleted + 1))
            reclaimed=$((reclaimed + size))
          done < "$inventory"

          echo "Deleted ${deleted} artifacts; requested reclaimed bytes=${reclaimed}."


  gov_kimi_deterministic:
    needs: detect_scopes
    if: ${{ needs.detect_scopes.outputs.kimi_evaluation_verification == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck provider-neutral intelligence contracts
        run: ./node_modules/.bin/tsc -p packages/pandora-intelligence/tsconfig.json
      - name: Evaluation and shadow safety regressions
        run: node --test packages/pandora-intelligence/test/kimi-*.test.js packages/pandora-intelligence/test/model-router.test.js
      - name: Independent provider verification regressions
        run: node --test test/pandora-model-provider-verification.test.js test/pandora-verification-engine.test.js

