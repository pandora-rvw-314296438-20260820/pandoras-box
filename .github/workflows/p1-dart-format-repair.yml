name: P1 Dart format repair

on:
  push:
    branches:
      - chatgpt/p1-ask-pandora-real-builder-20260903

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Format exact Builder source
        run: dart format apps/pandora-mobile/lib/features/simple/project_experience_v2.dart
      - name: Upload exact formatted source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p1-formatted-project-experience-v2
          path: apps/pandora-mobile/lib/features/simple/project_experience_v2.dart
          if-no-files-found: error
          retention-days: 1
