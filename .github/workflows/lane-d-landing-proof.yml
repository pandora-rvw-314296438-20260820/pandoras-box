name: Lane D landing proof
on:
  push:
    branches:
      - chatgpt/lane-d-polish-landing-minimal-v1
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Render requested evidence
        working-directory: apps/pandora-mobile
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          for name in             obsidian_chat_empty_390x844             lane_d_primary_nav_drawer_390x844             lane_d_recent_chats_drawer_390x844             lane_d_recent_chats_ellipsis_390x844
          do
            flutter test --update-goldens test/goldens/owner_screens_visual_evidence_test.dart --plain-name "captures $name"
            test -s "build/owner-screen-evidence/$name.png"
          done
          mkdir -p ../../docs/visual-evidence/lane-d/landing-minimal
          cp build/owner-screen-evidence/obsidian_chat_empty_390x844.png ../../docs/visual-evidence/lane-d/landing-minimal/landing.png
          cp build/owner-screen-evidence/lane_d_primary_nav_drawer_390x844.png ../../docs/visual-evidence/lane-d/landing-minimal/nav-drawer.png
          cp build/owner-screen-evidence/lane_d_recent_chats_drawer_390x844.png ../../docs/visual-evidence/lane-d/landing-minimal/recent-chats.png
          cp build/owner-screen-evidence/lane_d_recent_chats_ellipsis_390x844.png ../../docs/visual-evidence/lane-d/landing-minimal/ellipsis-menu.png
      - name: Commit evidence
        run: |
          set -euo pipefail
          git config user.name "pandora-lane-d-evidence"
          git config user.email "actions@users.noreply.github.com"
          git add apps/pandora-mobile/test/goldens/owner_screens/obsidian_chat_empty_390x844.png
          git add apps/pandora-mobile/test/goldens/owner_screens/lane_d_primary_nav_drawer_390x844.png
          git add apps/pandora-mobile/test/goldens/owner_screens/lane_d_recent_chats_drawer_390x844.png
          git add apps/pandora-mobile/test/goldens/owner_screens/lane_d_recent_chats_ellipsis_390x844.png
          git add docs/visual-evidence/lane-d/landing-minimal
          git diff --cached --quiet && exit 0
          git commit -m "test(mobile): add Lane D landing and drawer PNG proof"
          git push origin HEAD:chatgpt/lane-d-polish-landing-minimal-v1
