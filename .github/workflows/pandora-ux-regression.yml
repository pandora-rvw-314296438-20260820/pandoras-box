name: Pandora mobile UX behavior
on:
  pull_request:
    paths:
      - 'apps/pandora-mobile/**'
      - '.github/workflows/pandora-ux-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pandora-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  widget-journeys:
    name: UX / responsive workspace and navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Analyze and run production-widget journeys
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub lib/features/enterprise/enterprise_workspace_home.dart test/features/enterprise/enterprise_workspace_navigation_test.dart
          flutter test --no-pub --reporter expanded test/features/enterprise/enterprise_workspace_navigation_test.dart test/app/pandora_chat_navigation_test.dart test/app/plp_navigation_drawer_test.dart test/app/plp_command_dock_keyboard_test.dart test/app/plp_owner_journey_acceptance_test.dart

      - name: Capture Lane D Connections provider-state evidence
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --update-goldens --reporter expanded \
            test/goldens/owner_screens_visual_evidence_test.dart \
            --plain-name 'captures connections_healthy_porcelain_390x844'
          flutter test --no-pub --update-goldens --reporter expanded \
            test/goldens/owner_screens_visual_evidence_test.dart \
            --plain-name 'captures connections_all_providers_obsidian_390x2200'

      - name: Upload Lane D Connections provider-state evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: lane-d-connections-evidence-${{ env.SOURCE_SHA }}
          path: |
            apps/pandora-mobile/build/owner-screen-evidence/connections_healthy_porcelain_390x844.png
            apps/pandora-mobile/build/owner-screen-evidence/connections_all_providers_obsidian_390x2200.png
            apps/pandora-mobile/test/goldens/owner_screens/connections_healthy_porcelain_390x844.png
            apps/pandora-mobile/test/goldens/owner_screens/connections_all_providers_obsidian_390x2200.png
          if-no-files-found: error
          retention-days: 7
