name: Pandora mobile UX behavior
on:
  pull_request:
    paths:
      - 'apps/pandora-mobile/**'
      - '.github/workflows/pandora-ux-regression.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pandora-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  widget-journeys:
    name: UX / responsive workspace and navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Analyze and run production-widget journeys
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub lib/features/enterprise/enterprise_workspace_home.dart test/features/enterprise/enterprise_workspace_navigation_test.dart
          flutter test --no-pub --reporter expanded test/features/enterprise/enterprise_workspace_navigation_test.dart test/app/pandora_chat_navigation_test.dart test/app/plp_navigation_drawer_test.dart test/app/plp_command_dock_keyboard_test.dart test/app/plp_owner_journey_acceptance_test.dart test/features/simple/pandora_picker_tap_through_test.dart

      - name: Refresh reviewed Lane G goldens for artifact promotion
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          for case_name in \
            obsidian_chat_shell_390x844 \
            obsidian_chat_empty_390x844 \
            model_picker_obsidian_390x844 \
            reasoning_picker_obsidian_390x844 \
            lane_g_bok_restaurants_section_390x844
          do
            flutter test --no-pub --reporter expanded \
              test/goldens/owner_screens_visual_evidence_test.dart \
              --plain-name "captures $case_name" \
              --update-goldens
          done
          test -s test/goldens/owner_screens/obsidian_chat_shell_390x844.png
          test -s test/goldens/owner_screens/obsidian_chat_empty_390x844.png
          test -s test/goldens/owner_screens/model_picker_obsidian_390x844.png
          test -s test/goldens/owner_screens/reasoning_picker_obsidian_390x844.png
          cp build/owner-screen-evidence/lane_g_bok_restaurants_section_390x844.png test/goldens/owner_screens/lane_g_bok_restaurants_section_390x844.png
          test -s test/goldens/owner_screens/lane_g_bok_restaurants_section_390x844.png

      # BEGIN LANE_G_PROMOTION
      - name: Promote reviewed Lane G goldens and restore compare-only gate
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'chatgpt/lane-g-item8-real-picker-goldens'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize-lane-g-item8-goldens.py
          git config user.name "pandora-lane-g-golden-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/pandora-ux-regression.yml
          git add apps/pandora-mobile/test/goldens/owner_screens/obsidian_chat_shell_390x844.png
          git add apps/pandora-mobile/test/goldens/owner_screens/obsidian_chat_empty_390x844.png
          git add apps/pandora-mobile/test/goldens/owner_screens/model_picker_obsidian_390x844.png
          git add apps/pandora-mobile/test/goldens/owner_screens/reasoning_picker_obsidian_390x844.png
          git add apps/pandora-mobile/test/goldens/owner_screens/lane_g_bok_restaurants_section_390x844.png
          git add -u scripts/finalize-lane-g-item8-goldens.py
          git diff --cached --quiet && exit 0
          git commit -m "test: promote Lane G reviewed golden baselines"
          git push origin HEAD:${{ github.head_ref }}
      # END LANE_G_PROMOTION

      - name: Capture Lane E exact-source shell evidence
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded tool/evidence/lane_e_shell_evidence_test.dart
          evidence=build/lane-e-shell-evidence
          for image in \
            01-resting-composer.png \
            02-typing.png \
            03-history-expanded.png \
            04-long-page-scrolled-under-composer.png \
            05-hamburger-fixed.png
          do
            test -s "$evidence/$image"
          done
          {
            echo "source_sha=$SOURCE_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "capture_test=tool/evidence/lane_e_shell_evidence_test.dart"
          } > "$evidence/manifest.txt"

      - name: Upload Lane E shell evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lane-e-shell-evidence-${{ env.SOURCE_SHA }}
          path: |
            apps/pandora-mobile/build/lane-e-shell-evidence
            apps/pandora-mobile/build/owner-screen-evidence
            apps/pandora-mobile/test/failures/owner_screens
            apps/pandora-mobile/test/goldens/owner_screens/obsidian_chat_shell_390x844.png
            apps/pandora-mobile/test/goldens/owner_screens/obsidian_chat_empty_390x844.png
            apps/pandora-mobile/test/goldens/owner_screens/model_picker_obsidian_390x844.png
            apps/pandora-mobile/test/goldens/owner_screens/reasoning_picker_obsidian_390x844.png
            apps/pandora-mobile/test/goldens/owner_screens/lane_g_bok_restaurants_section_390x844.png
          if-no-files-found: error
          retention-days: 7
