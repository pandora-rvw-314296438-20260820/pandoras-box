name: Pandora mobile UX behavior
on:
  pull_request:
    paths:
      - 'apps/pandora-mobile/**'
      - '.github/workflows/pandora-ux-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pandora-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  widget-journeys:
    name: UX / responsive workspace and navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Analyze and run production-widget journeys
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub lib/features/enterprise/enterprise_workspace_home.dart test/features/enterprise/enterprise_workspace_navigation_test.dart
          flutter test --no-pub --reporter expanded test/features/enterprise/enterprise_workspace_navigation_test.dart test/app/pandora_chat_navigation_test.dart test/app/lane_h_chat_polish_test.dart test/app/plp_navigation_drawer_test.dart test/app/plp_command_dock_keyboard_test.dart test/app/plp_owner_journey_acceptance_test.dart test/features/simple/pandora_picker_tap_through_test.dart

      - name: Capture and verify Lane H owner goldens
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded test/goldens/lane_h_chat_picker_visual_evidence_test.dart
          flutter test --no-pub --reporter expanded             test/goldens/owner_screens_visual_evidence_test.dart             --plain-name "captures lane_g_bok_restaurants_section_390x844"
          for image in             lane_h_landing_resting_390x844             lane_h_keyboard_open_390x844             lane_h_after_send_thinking_390x844             lane_h_picker_open_390x844             lane_h_picker_end_390x844             lane_h_non_auto_tag_390x844
          do
            test -s "test/goldens/owner_screens/$image.png"
          done
          test -s test/goldens/owner_screens/lane_g_bok_restaurants_section_390x844.png

      - name: Upload Lane H shell and picker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lane-h-shell-picker-evidence-${{ env.SOURCE_SHA }}
          path: |
            apps/pandora-mobile/build/lane-h-goldens
            apps/pandora-mobile/test/failures/owner_screens
            apps/pandora-mobile/test/goldens/owner_screens/lane_h_landing_resting_390x844.png
            apps/pandora-mobile/test/goldens/owner_screens/lane_h_keyboard_open_390x844.png
            apps/pandora-mobile/test/goldens/owner_screens/lane_h_after_send_thinking_390x844.png
            apps/pandora-mobile/test/goldens/owner_screens/lane_h_picker_open_390x844.png
            apps/pandora-mobile/test/goldens/owner_screens/lane_h_picker_end_390x844.png
            apps/pandora-mobile/test/goldens/owner_screens/lane_h_non_auto_tag_390x844.png
            apps/pandora-mobile/test/goldens/owner_screens/lane_g_bok_restaurants_section_390x844.png
          if-no-files-found: error
          retention-days: 7
