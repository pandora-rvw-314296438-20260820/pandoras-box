name: Recover MCPMaster operational core

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'recovery/core-transport/**'
      - '.github/workflows/recover-operational-core.yml'

permissions:
  contents: write

jobs:
  recover-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: recovery/materialize-source
          fetch-depth: 0

      - name: Verify transport and decode archive
        shell: bash
        run: |
          set -euo pipefail
          echo '9b97b4b3d43a4f504c3a41c4b6a0705ba2e02747f67fcf863085354388570fd2  recovery/core-transport/core-000.b64' | sha256sum -c -
          echo '59e8f31cce7f12f96a58bd6dea3cb3a68a76aee66333295b07fc6c1992c9deaa  recovery/core-transport/core-rest.b64' | sha256sum -c -
          cat recovery/core-transport/core-000.b64 recovery/core-transport/core-rest.b64 | tr -d '[:space:]' | base64 -d > /tmp/mcp-core.tar.xz
          echo 'cfd98b1236e735f3bb3a8c0af65fcf60f968a53c12777021ad291e9e5a244643  /tmp/mcp-core.tar.xz' | sha256sum -c -
          mkdir -p /tmp/mcp-core
          tar -xJf /tmp/mcp-core.tar.xz -C /tmp/mcp-core
          test -f /tmp/mcp-core/package.json
          test -f /tmp/mcp-core/vercel.json
          test -f /tmp/mcp-core/api/mcp.ts
          test -f /tmp/mcp-core/apps/meta-business-mcp/src/operator/api.ts
          test -f /tmp/mcp-core/public/oauth/consent.html

      - name: Restore missing operational source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --ignore-existing /tmp/mcp-core/ ./
          test -f package.json
          test -f vercel.json
          test -f api/mcp.ts
          test -f apps/meta-business-mcp/src/operator/api.ts
          test -f public/oauth/consent.html

      - name: Apply recorded owner-binding repair when applicable
        shell: bash
        run: |
          set -euo pipefail
          if git apply --check patches/2026-08-08-owner-account-binding.patch 2>/dev/null; then
            git apply patches/2026-08-08-owner-account-binding.patch
          else
            echo 'Owner-binding patch does not apply cleanly as a whole; preserving patch as recovery evidence and refusing to claim it applied.'
          fi

      - name: Basic source safety checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIl --exclude='*.md' --exclude='*.patch' --exclude-dir='.git' '-----BEGIN PRIVATE KEY-----' package.json api apps public projectos scripts 2>/dev/null | grep .
          node -e "const p=require('./package.json'); if(!p.name) process.exit(1); console.log(p.name, p.version || '')"

      - name: Commit recovered operational core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vercel.json tsconfig*.json api apps public projectos scripts || true
          if git diff --cached --quiet; then
            echo 'No operational source changes to commit.'
            exit 0
          fi
          git commit -m 'recovery: restore MCPMaster operational core'
          git push origin HEAD:recovery/materialize-source
