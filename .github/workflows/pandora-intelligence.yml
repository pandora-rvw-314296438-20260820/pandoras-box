name: Pandora Intelligence
on:
  pull_request:
    paths:
      - 'packages/pandora-intelligence/**'
      - 'docs/architecture/PANDORA_INTELLIGENCE_*.md'
      - '.github/workflows/pandora-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'packages/pandora-intelligence/**'
      - 'docs/architecture/PANDORA_INTELLIGENCE_*.md'
      - '.github/workflows/pandora-intelligence.yml'
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build Pandora Intelligence
        run: ./node_modules/.bin/tsc -p packages/pandora-intelligence/tsconfig.json
      - name: Test Pandora Intelligence
        run: node --test packages/pandora-intelligence/test/*.test.js
