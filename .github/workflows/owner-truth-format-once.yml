name: Owner truth exact formatter once
on:
  push:
    branches:
      - fix/owner-truth-status-20260828
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - run: dart format apps/pandora-mobile/lib/core/data/owner_projection.dart apps/pandora-mobile/lib/features/simple/systems_screen.dart apps/pandora-mobile/test/core/owner_projection_test.dart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-truth-formatted
          path: |
            apps/pandora-mobile/lib/core/data/owner_projection.dart
            apps/pandora-mobile/lib/features/simple/systems_screen.dart
            apps/pandora-mobile/test/core/owner_projection_test.dart
          if-no-files-found: error
          retention-days: 1
