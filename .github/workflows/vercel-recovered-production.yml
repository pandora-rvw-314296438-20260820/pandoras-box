name: MCPMaster recovered production deployment

on:
  push:
    branches:
      - production/recovered-convergence-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcpmaster-recovered-production
  cancel-in-progress: false

env:
  VERCEL_TEAM_ID: team_IcdJUnzLi5wUN1GD8ALHyjF7
  VERCEL_PROJECT_ID: prj_Y5rZVcq8xJVzHVt4uvfmg9wPvXMk

jobs:
  verify-and-deploy:
    name: Verify and deploy recovered production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout recovered production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build and test recovered source
        run: npm test

      - name: Deploy exact source to existing Vercel production project
        run: node scripts/vercel-recovered-production-deploy.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ env.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
