name: Operations Memory client
on:
  pull_request:
    paths:
      - 'packages/pandora-operations-memory/**'
      - 'test/pandora-operations-memory*.test.js'
      - '.github/workflows/operations-memory-client.yml'
  push:
    branches: [main]
    paths:
      - 'packages/pandora-operations-memory/**'
      - 'test/pandora-operations-memory*.test.js'
      - '.github/workflows/operations-memory-client.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: node --check packages/pandora-operations-memory/contracts.mjs
      - run: node --check packages/pandora-operations-memory/native-client.mjs
      - run: node --test test/pandora-operations-memory*.test.js
