name: Pandora Edge source artifact

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-source-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain --untracked-files=all)"
          sha256sum \
            supabase/functions/pandora-project-runtime/index.ts \
            supabase/functions/pandora-project-source-generator/index.ts \
            supabase/functions/pandora-project-spec-compiler/index.ts \
            > edge-source-sha256.txt

      - name: Detect Edge source changes
        id: edge_changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            supabase/functions/pandora-project-runtime/index.ts \
            supabase/functions/pandora-project-source-generator/index.ts \
            supabase/functions/pandora-project-spec-compiler/index.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record exact PR Edge source receipt
        if: ${{ github.event_name == 'pull_request' && steps.edge_changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          digest="$(sha256sum edge-source-sha256.txt | cut -d ' ' -f1)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'PANDORA_EDGE_PR_SOURCE_RECEIPT source_sha=%s source_tree=%s manifest_sha256=%s release_authority=false artifact_provider=deferred\n' \
            "$source_sha" "$source_tree" "$digest"
          {
            echo '### Pull-request Edge source receipt'
            echo "- Source SHA: `$source_sha`"
            echo "- Source tree: `$source_tree`"
            echo "- Manifest SHA-256: `$digest`"
            echo '- Release authority: `false`'
            echo '- Artifact provider: deferred to non-PR/release lane'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact Edge sources
        if: ${{ github.event_name != 'pull_request' && steps.edge_changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pandora-edge-source-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            supabase/functions/pandora-project-runtime/index.ts
            supabase/functions/pandora-project-source-generator/index.ts
            supabase/functions/pandora-project-spec-compiler/index.ts
            edge-source-sha256.txt

      - name: Confirm no Edge source artifact is required
        if: ${{ steps.edge_changes.outputs.changed != 'true' }}
        run: echo "No governed Edge source changed in this pull request."
