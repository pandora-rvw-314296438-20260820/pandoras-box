name: Kimi Evaluation and Verification
on:
  pull_request:
    paths:
      - 'packages/pandora-intelligence/**'
      - 'packages/pandora-verification/**'
      - 'test/pandora-model-provider-verification.test.js'
      - '.github/workflows/kimi-evaluation-verification.yml'
  push:
    branches: [main]
    paths:
      - 'packages/pandora-intelligence/**'
      - 'packages/pandora-verification/**'
      - 'test/pandora-model-provider-verification.test.js'
      - '.github/workflows/kimi-evaluation-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck provider-neutral intelligence contracts
        run: ./node_modules/.bin/tsc -p packages/pandora-intelligence/tsconfig.json
      - name: Evaluation and shadow safety regressions
        run: node --test packages/pandora-intelligence/test/kimi-*.test.js packages/pandora-intelligence/test/model-router.test.js
      - name: Independent provider verification regressions
        run: node --test test/pandora-model-provider-verification.test.js test/pandora-verification-engine.test.js
