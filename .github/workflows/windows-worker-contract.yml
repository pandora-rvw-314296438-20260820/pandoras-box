name: Windows Worker Contract

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-impact:
    name: Detect Windows worker impact
    runs-on: [self-hosted, Windows, X64, pandora-ci-windows]
    outputs:
      windows: ${{ steps.detect.outputs.windows }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          windows=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            windows=false
            if git rev-parse "${GITHUB_SHA}^1" >/dev/null 2>&1; then
              while IFS= read -r path; do
                case "$path" in
                  apps/pandora-mobile/*|docs/*)
                    ;;
                  *)
                    windows=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}")
            else
              windows=true
            fi
          fi
          echo "windows=${windows}" >> "$GITHUB_OUTPUT"

  worker-contract:
    needs: worker-impact
    if: ${{ needs.worker-impact.outputs.windows == 'true' }}
    name: Windows worker contract
    runs-on: [self-hosted, Windows, X64, pandora-ci-windows]
    timeout-minutes: 15
    steps:
      - name: Preserve repository LF bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Verify exact checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ github.sha }}') { exit 1 }
          if (git status --porcelain --untracked-files=all) { exit 1 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:worker
      - name: Confirm tests did not mutate source
        shell: pwsh
        run: if (git status --porcelain --untracked-files=all) { exit 1 }
