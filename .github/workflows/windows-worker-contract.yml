name: Windows Worker Contract

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-contract:
    name: Windows worker contract
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Preserve repository LF bytes
        run: git config --global core.autocrlf false

      - name: Check out the exact provider candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SOURCE_SHA) { exit 1 }
          if (git status --porcelain --untracked-files=all) { exit 1 }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test

      - name: Confirm validation did not mutate source
        shell: pwsh
        run: if (git status --porcelain --untracked-files=all) { exit 1 }
