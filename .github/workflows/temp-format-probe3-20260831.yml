name: Temporary package-resolved Dart format probe

on:
  push:
    branches:
      - codex/format-probe3-20260831

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out probe source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Resolve exact mobile package, format, and retire probe
        run: |
          cd apps/pandora-mobile
          flutter pub get --enforce-lockfile
          dart format \
            lib/core/data/project_experience_api.dart \
            lib/features/diagnostics/developer_diagnostics_screen.dart \
            lib/features/simple/project_experience_v2.dart \
            test/architecture/worker_g_product_experience_guard_test.dart
          cd ../..
          rm .github/workflows/temp-format-probe3-20260831.yml
          git config user.name 'pandora-format-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'style(mobile): apply package-resolved Dart formatter'
          git push origin HEAD:codex/format-probe3-20260831
