name: History package-context formatter

on:
  push:
    branches:
      - chatgpt/history-ux-79-81-20260903
    paths:
      - .github/workflows/history-package-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: chatgpt/history-ux-79-81-20260903
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Resolve exact app lockfile and format History
        shell: bash
        run: |
          set -euo pipefail
          cd apps/pandora-mobile
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          dart format lib/features/simple/project_history_screen.dart
          cd ../..
          git rm .github/workflows/history-package-formatter.yml
          git add apps/pandora-mobile/lib/features/simple/project_history_screen.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(history): format under resolved app context'
          git push origin HEAD:chatgpt/history-ux-79-81-20260903
