name: Operations Room runtime
on:
  pull_request:
    paths:
      - 'packages/pandora-operations-room/**'
      - 'packages/pandora-verification/src/registry.js'
      - 'supabase/functions/pandora-operations-runtime/**'
      - 'supabase/migrations/*pandora_operations_room_runtime*'
      - 'test/pandora-operations-room-runtime*.test.js'
      - '.github/workflows/operations-room-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'packages/pandora-operations-room/**'
      - 'packages/pandora-verification/src/registry.js'
      - 'supabase/functions/pandora-operations-runtime/**'
      - 'supabase/migrations/*pandora_operations_room_runtime*'
      - 'test/pandora-operations-room-runtime*.test.js'
      - '.github/workflows/operations-room-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-postgres-races:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: pandora_ops_ci
          # Disposable test-container password, not a provider or production secret.
          POSTGRES_PASSWORD: pandora_ops_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: pandora_ops_ci
      PGUSER: postgres
      PGPASSWORD: pandora_ops_ci_only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused contracts, owner API and SQL state machine
        run: node --test test/pandora-operations-room-runtime*.test.js
      - name: Check new Edge entrypoint
        run: npx --yes deno-bin@2.2.7 check --node-modules-dir=none --frozen supabase/functions/pandora-operations-runtime/index.ts
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version
      - name: Independent PostgreSQL sessions exercise real claim and dispatch races
        run: node --test packages/pandora-operations-room/test/postgres-races.mjs
