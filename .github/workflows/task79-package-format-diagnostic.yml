
name: Task79 package formatter diagnostic
on:
  push:
    branches:
      - chatgpt/task79-package-format-diagnostic-20260903
permissions:
  contents: read
jobs:
  format-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Resolve exact lockfile and format in package context
        shell: bash
        run: |
          set -euo pipefail
          cd apps/pandora-mobile
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          dart format lib/features/simple/project_history_screen.dart
          cp lib/features/simple/project_history_screen.dart "$GITHUB_WORKSPACE/project_history_screen.dart"
          sha256sum "$GITHUB_WORKSPACE/project_history_screen.dart"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: task79-history-package-format
          path: project_history_screen.dart
          retention-days: 1
