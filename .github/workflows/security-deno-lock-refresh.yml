name: Security Deno lock refresh

on:
  push:
    branches:
      - "security/vercel-node-5x-remediation-20260826"
    paths:
      - ".github/workflows/security-deno-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-deno-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: security/vercel-node-5x-remediation-20260826

      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Refresh Deno lockfile for Supabase type graph
        run: >-
          npx --yes deno-bin@2.2.7 check --node-modules-dir=none --frozen=false
          supabase/functions/pandora-owner-api/index.ts
          supabase/functions/pandora-worker-dispatch/index.ts
          supabase/functions/pandora-reviewer-attestation/index.ts
          supabase/functions/pandora-release-review-attestation/index.ts
          supabase/functions/pandora-release-owner-authorization/index.ts
          supabase/functions/pandora-physical-android-attestation/index.ts
          supabase/functions/mcpmaster-supabase-control/index.ts

      - name: Verify full repository check with frozen lockfile
        run: npm run check

      - name: Reconfirm npm advisory inventory
        run: npm audit --audit-level=low

      - name: Validate lockfile diff
        run: git diff --check -- deno.lock

      - name: Commit refreshed Deno lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pandora-security-bot"
          git config user.email "pandora-security-bot@users.noreply.github.com"
          git add deno.lock
          if git diff --cached --quiet; then
            echo "No Deno lockfile change generated"
            exit 1
          fi
          git commit -m "security: refresh Deno lock for build-chain remediation"
          git push origin HEAD:security/vercel-node-5x-remediation-20260826
