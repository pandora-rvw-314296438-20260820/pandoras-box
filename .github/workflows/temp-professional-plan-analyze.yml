name: Professional plan analyzer diagnostic

on:
  push:
    branches:
      - feature/professional-build-plan-20260901
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/professional-build-plan-20260901
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Capture exact analyzer output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile . >/dev/null
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          flutter pub get --enforce-lockfile >/dev/null
          set +e
          flutter analyze > ../.tmp-professional-plan-analyzer.txt 2>&1
          status=$?
          set -e
          cd ..
          printf '\nanalyzer_exit=%s\n' "$status" >> .tmp-professional-plan-analyzer.txt
          git config user.name 'pandora-rvw-314296438-20260820'
          git config user.email 'plpboracay@gmail.com'
          git add .tmp-professional-plan-analyzer.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diag: capture professional plan analyzer output'
          git push origin HEAD:feature/professional-build-plan-20260901
