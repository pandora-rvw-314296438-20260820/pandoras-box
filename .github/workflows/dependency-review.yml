name: Dependency Review

on:
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect pull-request dependency manifest changes
        if: ${{ github.event_name == 'pull_request' }}
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/dependency-review-files.txt"
          if grep -Eq '(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|pubspec\.ya?ml|pubspec\.lock|requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|Pipfile(\.lock)?|go\.(mod|sum)|Cargo\.(toml|lock)|Gemfile(\.lock)?|composer\.(json|lock))$' "$RUNNER_TEMP/dependency-review-files.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review public repository dependency changes
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.changed == 'true' && !github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Use Node 24 for private or merge-queue dependency audit
        if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && steps.scope.outputs.changed == 'true' && github.event.repository.private) }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Audit locked dependency state
        if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && steps.scope.outputs.changed == 'true' && github.event.repository.private) }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run audit:prod
          npm ci --prefix tooling --ignore-scripts --no-audit --no-fund
          npm run tooling:audit

      - name: Confirm no dependency review is required
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.changed != 'true' }}
        run: echo "No dependency manifests or lockfiles changed in this pull request."
