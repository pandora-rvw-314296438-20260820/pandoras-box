name: Temporary Pandora mobile diagnostics

on:
  push:
    branches:
      - feature/pandora-intent-distillation-20260901

permissions:
  contents: read

jobs:
  analyze-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install exact Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Resolve exact lockfile
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
      - name: Flutter analyze diagnostic
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set +e
          flutter analyze > /tmp/analyze.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '(^|[[:space:]])(error|warning|info)[[:space:]]+•|issues? found|No issues found' /tmp/analyze.log | while IFS= read -r line; do
              echo "::error title=Flutter analyze::$line"
            done
          fi
          exit "$status"
