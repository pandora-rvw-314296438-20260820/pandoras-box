name: Pandora mobile format helper

on:
  pull_request:
    paths:
      - 'apps/pandora-mobile/**'
      - '.github/workflows/pandora-mobile-format-helper.yml'

concurrency:
  group: pandora-mobile-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Resolve exact lockfile
        working-directory: apps/pandora-mobile
        run: flutter pub get --enforce-lockfile
      - name: Format current Pandora mobile sources
        working-directory: apps/pandora-mobile
        run: dart format lib test
      - name: Record changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -- apps/pandora-mobile/lib apps/pandora-mobile/test | tee formatted-files.txt
          if test -s formatted-files.txt; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Stage formatted sources
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p formatted
          cp -R apps formatted/
          cp formatted-files.txt formatted/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.changes.outputs.changed == 'true'
        with:
          name: pandora-mobile-exact-formatted-${{ github.event.pull_request.head.sha }}
          path: formatted
          include-hidden-files: true
          retention-days: 1
      - name: Commit exact formatter output through the Supabase Vault path
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path

          files = [line.strip() for line in Path('formatted-files.txt').read_text().splitlines() if line.strip()]
          allowed = {
              'apps/pandora-mobile/lib/app/pandora_shell.dart',
              'apps/pandora-mobile/lib/pandora_config.dart',
              'apps/pandora-mobile/lib/core/data/project_experience_api.dart',
              'apps/pandora-mobile/lib/features/simple/pandora_v2_ui.dart',
              'apps/pandora-mobile/lib/features/simple/project_create_experience.dart',
              'apps/pandora-mobile/lib/features/simple/project_experience_v2.dart',
              'apps/pandora-mobile/lib/features/simple/projects_screen.dart',
              'apps/pandora-mobile/lib/features/simple/simple_home_screen.dart',
              'apps/pandora-mobile/test/app/pandora_shell_test.dart',
              'apps/pandora-mobile/test/architecture/foundation_source_guard_test.dart',
              'apps/pandora-mobile/test/architecture/simple_mode_master_plan_guard_test.dart',
              'apps/pandora-mobile/test/architecture/worker_g_create_understand_guard_test.dart',
              'apps/pandora-mobile/test/architecture/worker_g_product_experience_guard_test.dart',
          }
          if not files or any(path not in allowed for path in files):
              raise SystemExit('formatter changed an unauthorized path')
          payload = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'branch': os.environ['HEAD_REF'],
              'expectedHead': os.environ['EXPECTED_HEAD'],
              'files': [
                  {
                      'path': path,
                      'contentBase64': base64.b64encode(Path(path).read_bytes()).decode('ascii'),
                  }
                  for path in files
              ],
          }
          Path('format-commit-payload.json').write_text(json.dumps(payload), encoding='utf-8')
          PY
          token_json="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pandora-format-commit-20260830")"
          oidc="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json")"
          status="$(curl --silent --show-error \
            -o format-commit-response.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${oidc}" \
            -H 'Content-Type: application/json' \
            --data-binary @format-commit-payload.json \
            'https://jcyqixttuebxqqfkjonq.supabase.co/functions/v1/pandora-github-format-commit-20260830')"
          cat format-commit-response.json
          test "$status" = '200'
