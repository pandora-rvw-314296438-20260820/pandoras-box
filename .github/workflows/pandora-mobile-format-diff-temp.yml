name: Pandora mobile format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Print exact formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/pandora-mobile/lib/features/simple/project_experience_v2.dart
          git diff -- apps/pandora-mobile/lib/features/simple/project_experience_v2.dart
          exit 1
