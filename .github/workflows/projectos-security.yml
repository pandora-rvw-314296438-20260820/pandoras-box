name: ProjectOS security regression

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: projectos-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact integration SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          {
            echo "### Exact-source binding"
            echo
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Expected: \`${EXPECTED_SHA}\`"
            echo "- Checked out: \`${actual_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
