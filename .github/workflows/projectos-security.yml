name: ProjectOS security regression

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectos-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact provider candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        run: |
          actual_sha="$(git rev-parse HEAD)"
          {
            echo "### Exact-source binding"
            echo
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Expected: \`${EXPECTED_SHA}\`"
            echo "- Checked out: \`${actual_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$actual_sha" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

      - name: Confirm validation did not mutate source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
