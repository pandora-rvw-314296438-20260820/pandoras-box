
name: Domain format capture
on:
  push:
    branches:
      - feature/vercel-domain-registrar-20260830-v3
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Capture canonical Dart formatting
        run: |
          set -euo pipefail
          dart format \
            apps/pandora-mobile/lib/core/data/domain_registrar_api.dart \
            apps/pandora-mobile/lib/core/models/domain_registrar_models.dart \
            apps/pandora-mobile/lib/features/simple/domains_screen.dart
          git diff --binary -- \
            apps/pandora-mobile/lib/core/data/domain_registrar_api.dart \
            apps/pandora-mobile/lib/core/models/domain_registrar_models.dart \
            apps/pandora-mobile/lib/features/simple/domains_screen.dart > /tmp/domain-format.patch
          test -s /tmp/domain-format.patch
      - name: Upload formatting patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: domain-format-patch
          path: /tmp/domain-format.patch
          retention-days: 1
