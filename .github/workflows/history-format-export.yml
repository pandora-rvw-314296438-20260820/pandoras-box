name: History formatter commit
on:
  push:
    branches:
      - chatgpt/history-ux-79-81-20260903
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Format and commit History source
        run: |
          dart format apps/pandora-mobile/lib/features/simple/project_history_screen.dart
          if git diff --quiet -- apps/pandora-mobile/lib/features/simple/project_history_screen.dart; then
            exit 0
          fi
          git config user.name 'pandora-rvw-314296438-20260820'
          git config user.email 'plpboracay@gmail.com'
          git add apps/pandora-mobile/lib/features/simple/project_history_screen.dart
          git commit -m 'style(mobile): apply canonical History formatting'
          git push origin HEAD:chatgpt/history-ux-79-81-20260903
