name: Simple Home formatter

on:
  push:
    branches:
      - fix/simple-home-confirmation-language-20260828

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Export canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          file=apps/pandora-mobile/lib/features/simple/simple_home_screen.dart
          dart format "$file"
          echo "FORMAT_BEGIN:$file"
          base64 -w0 "$file"
          echo
          echo "FORMAT_END:$file"
