name: Pandora security regression

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pandora-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node24:
    runs-on: [self-hosted, Windows, X64, pandora-ci-windows]
    timeout-minutes: 15
    steps:
      - name: Check out exact integration SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          @(
            "### Exact-source binding"
            ""
            "- Event: $env:GITHUB_EVENT_NAME"
            "- Expected: $env:EXPECTED_SHA"
            "- Checked out: $actualSha"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          if ($actualSha -ne $env:EXPECTED_SHA) { exit 1 }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Run npm test with diagnostic capture
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath npm-test-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload npm test diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-security-npm-test-output
          path: npm-test-output.txt
          if-no-files-found: error
          retention-days: 1
      - run: npm audit --omit=dev --audit-level=high
