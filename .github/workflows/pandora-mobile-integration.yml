name: Pandora mobile exact-source gate

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: pandora-mobile-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Exact source / Flutter / Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      android-artifact-id: ${{ steps.android_provider_locator.outputs.artifact_id }}
      android-artifact-name: ${{ steps.android_provider_locator.outputs.artifact_name }}
      android-artifact-api-url: ${{ steps.android_provider_locator.outputs.artifact_api_url }}
      android-artifact-digest-sha256: ${{ steps.android_provider_locator.outputs.artifact_digest_sha256 }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      FLUTTER_VERSION: '3.47.0'
      EXPECTED_APP_VERSION: '0.4.0-rc.1+7'
      ANDROID_ARTIFACT_NAME: pandora-mobile-android-validation-${{ github.sha }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Guard the single read-only mobile lane
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/pandora-mobile-diagnostic-apk.yml
          test ! -e .github/workflows/pandora-mobile-exact-head-gate.yml
          test ! -e .github/workflows/pandora-mobile-format-context-once.yml
          grep -Fq '  contents: read' \
            .github/workflows/pandora-mobile-integration.yml
          ! grep -Eq \
            'contents:[[:space:]]+write|statuses:[[:space:]]+write|git[[:space:]]+push|gh[[:space:]]+release' \
            .github/workflows/pandora-mobile-integration.yml
          grep -Fq \
            'cp -R ../apps/pandora-mobile/platform ./platform' \
            .github/workflows/pandora-mobile-integration.yml

      - name: Verify the canonical Pandora spiral identity
        shell: bash
        run: |
          set -euo pipefail
          mark=apps/pandora-mobile/lib/core/widgets/pandora_mark.dart
          asset=apps/pandora-mobile/assets/brand/pandora-product-mark-ui-1024.png
          android_tool=apps/pandora-mobile/tool/configure_validation_android.py
          test "$(sha256sum "$asset" | cut -d ' ' -f1)" = \
            '8a35b74baec47b960a42bb74587f9c531d6cbf8d45f16061836a9e63f00efcc5'
          grep -Fq "pandora-product-mark-ui-1024.png" "$mark"
          grep -Fq 'BlendMode.srcIn' "$mark"
          ! grep -Fq '_PandoraApplePainter' "$mark"
          grep -Fq 'pandora_product_mark' "$android_tool"
          grep -Fq 'canonical Pandora spiral apple' "$android_tool"

      - name: Scan the candidate for private-key literals
        shell: bash
        run: >-
          bash apps/pandora-mobile/tool/check_private_key_literals.sh
          apps/pandora-mobile
          .github/workflows/pandora-mobile-integration.yml

      - name: Test the bounded Android manifest tool
        run: >-
          python3 -m unittest discover
          -s apps/pandora-mobile/tool
          -p 'test_*.py'

      - name: Install pinned JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Materialize disposable Android and Web platforms
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create \
            --platforms=android,web \
            --org com.banataosystems \
            --project-name pandora_mobile \
            .
          cp -R ../apps/pandora-mobile/platform/android/. ./android/
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp -R ../apps/pandora-mobile/platform ./platform
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          python3 ../apps/pandora-mobile/tool/configure_validation_android.py \
            android/app/src/main/AndroidManifest.xml

      - name: Resolve the exact lockfile
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock

      - name: Format
        working-directory: .pandora-mobile-build
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Materialize canonical web formatter repair
        if: ${{ failure() }}
        working-directory: .pandora-mobile-build
        run: |
          dart format lib/core/platform/pandora_web_preview_web.dart
          dart format lib/core/models/project_focus_token.dart test/project_focus_token_test.dart
          echo PANDORA_FOCUS_MODEL_FORMAT_BEGIN
          cat lib/core/models/project_focus_token.dart
          echo PANDORA_FOCUS_MODEL_FORMAT_END
          echo PANDORA_FOCUS_TEST_FORMAT_BEGIN
          cat test/project_focus_token_test.dart
          echo PANDORA_FOCUS_TEST_FORMAT_END

      - name: Upload canonical web formatter repair
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-web-formatter-canonical
          path: .pandora-mobile-build/lib/core/platform/pandora_web_preview_web.dart
          if-no-files-found: error
          retention-days: 1

      - name: Analyze
        working-directory: .pandora-mobile-build
        run: flutter analyze

      - name: Test
        working-directory: .pandora-mobile-build
        run: flutter test --reporter expanded

      - name: Build non-production Web candidate
        working-directory: .pandora-mobile-build
        run: >-
          flutter build web --release
          --dart-define=PANDORA_SOURCE_REVISION=${{ env.SOURCE_SHA }}
          --dart-define=PANDORA_APP_VERSION=${{ env.EXPECTED_APP_VERSION }}

      - name: Build non-production Android candidate
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/{print $2; exit}' pubspec.yaml)" = \
            "$EXPECTED_APP_VERSION"
          flutter build apk --debug \
            --dart-define=PANDORA_SOURCE_REVISION="$SOURCE_SHA" \
            --dart-define=PANDORA_APP_VERSION="$EXPECTED_APP_VERSION"

      - name: Inspect Android identity and permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=.pandora-mobile-build/build/app/outputs/flutter-apk/app-debug.apk
          evidence=.pandora-mobile-build/android-package-evidence
          mkdir -p "$evidence"
          aapt="${ANDROID_HOME:?}/build-tools/36.0.0/aapt"
          apksigner="${ANDROID_HOME:?}/build-tools/36.0.0/apksigner"
          test -x "$aapt"
          test -x "$apksigner"
          "$aapt" dump badging "$apk" > "$evidence/badging.txt"
          "$aapt" dump permissions "$apk" > "$evidence/permissions.txt"
          "$apksigner" verify --verbose --print-certs "$apk" > "$evidence/signing.txt"
          grep -Fq "package: name='com.banataosystems.pandora_mobile'" \
            "$evidence/badging.txt"
          grep -Fq "versionCode='7'" "$evidence/badging.txt"
          grep -Fq "versionName='0.4.0-rc.1'" "$evidence/badging.txt"
          grep -Fq "application-label:'Pandora'" "$evidence/badging.txt"
          if grep -Eiq \
            'ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|READ_CONTACTS|WRITE_CONTACTS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_|CAMERA|RECORD_AUDIO|BLUETOOTH_(SCAN|CONNECT|ADVERTISE)|QUERY_ALL_PACKAGES|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW' \
            "$evidence/permissions.txt"; then
            echo 'Unexpected sensitive Android permission detected.' >&2
            exit 1
          fi

      - name: Bind artifacts to the exact source
        shell: bash
        run: |
          set -euo pipefail
          apk=.pandora-mobile-build/build/app/outputs/flutter-apk/app-debug.apk
          web=.pandora-mobile-build/build/web
          evidence=.pandora-mobile-build/android-package-evidence
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "android_artifact_name=${ANDROID_ARTIFACT_NAME}"
            echo "app_version=${EXPECTED_APP_VERSION}"
            echo 'android_package=com.banataosystems.pandora_mobile'
            echo "flutter_version=${FLUTTER_VERSION}"
            echo 'runner_image=ubuntu-24.04'
            echo 'java_version=17.0.20+8'
            echo 'android_platform=android-36'
            echo 'android_build_tools=36.0.0'
            echo 'artifact_class=validation-candidate'
            echo 'production_release=false'
            echo 'physical_device_verified=false'
            echo 'wifi_journey_verified=false'
            echo 'mobile_data_journey_verified=false'
            echo 'authenticated_owner_journey_verified=false'
            echo 'rollback_verified=false'
            echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f1)"
            echo "apk_size_bytes=$(stat -c '%s' "$apk")"
            echo "web_tree_sha256=$(find "$web" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
            echo "android_badging_sha256=$(sha256sum "$evidence/badging.txt" | cut -d ' ' -f1)"
            echo "android_permissions_sha256=$(sha256sum "$evidence/permissions.txt" | cut -d ' ' -f1)"
            echo "android_signing_sha256=$(sha256sum "$evidence/signing.txt" | cut -d ' ' -f1)"
          } > .pandora-mobile-build/pandora-mobile-artifact-manifest.txt

      - name: Upload Web validation candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-web-validation
          path: |
            .pandora-mobile-build/build/web
            .pandora-mobile-build/pandora-mobile-artifact-manifest.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload Android validation candidate
        id: upload_android_validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ env.ANDROID_ARTIFACT_NAME }}
          path: |
            .pandora-mobile-build/build/app/outputs/flutter-apk/app-debug.apk
            .pandora-mobile-build/pandora-mobile-artifact-manifest.txt
            .pandora-mobile-build/android-package-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Publish the Android provider locator
        id: android_provider_locator
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload_android_validation.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_android_validation.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          manifest=.pandora-mobile-build/pandora-mobile-artifact-manifest.txt
          apk_sha256="$(grep '^apk_sha256=' "$manifest" | cut -d= -f2-)"
          apk_size_bytes="$(grep '^apk_size_bytes=' "$manifest" | cut -d= -f2-)"
          android_package="$(grep '^android_package=' "$manifest" | cut -d= -f2-)"
          app_version="$(grep '^app_version=' "$manifest" | cut -d= -f2-)"
          [[ "$apk_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$apk_size_bytes" =~ ^[1-9][0-9]*$ ]]
          test "$android_package" = 'com.banataosystems.pandora_mobile'
          test "$app_version" = "$EXPECTED_APP_VERSION"
          artifact_api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          {
            echo "artifact_id=${ARTIFACT_ID}"
            echo "artifact_name=${ANDROID_ARTIFACT_NAME}"
            echo "artifact_api_url=${artifact_api_url}"
            echo "artifact_digest_sha256=${ARTIFACT_DIGEST}"
            echo "apk_sha256=${apk_sha256}"
            echo "apk_size_bytes=${apk_size_bytes}"
            echo "android_package=${android_package}"
            echo "app_version=${app_version}"
          } >> "$GITHUB_OUTPUT"
          printf 'PANDORA_ANDROID_RECEIPT source_sha=%s apk_sha256=%s apk_size_bytes=%s android_package=%s app_version=%s artifact_id=%s artifact_digest_sha256=%s artifact_name=%s\n' \
            "$SOURCE_SHA" "$apk_sha256" "$apk_size_bytes" "$android_package" "$app_version" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ANDROID_ARTIFACT_NAME"
          {
            echo '### Android validation artifact provider locator'
            echo
            echo "- Artifact ID: \`${ARTIFACT_ID}\`"
            echo "- Artifact name: \`${ANDROID_ARTIFACT_NAME}\`"
            echo "- Artifact API URL: \`${artifact_api_url}\`"
            echo "- GitHub artifact digest: \`sha256:${ARTIFACT_DIGEST}\`"
            echo "- APK SHA-256: \`${apk_sha256}\`"
            echo "- APK size bytes: \`${apk_size_bytes}\`"
            echo "- Android package: \`${android_package}\`"
            echo "- App version: \`${app_version}\`"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload visual failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-visual-failures
          path: .pandora-mobile-build/test/goldens/failures
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7


  verify-ios:
    name: Exact source / Flutter / iOS
    runs-on: macos-15
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.sha }}
      FLUTTER_VERSION: '3.47.0'
      EXPECTED_APP_VERSION: '0.4.0-rc.1+7'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify cross-platform preview governance
        shell: bash
        run: |
          set -euo pipefail
          node --test test/mobile-preview-platform-hosts.test.js
          bash apps/pandora-mobile/tool/check_private_key_literals.sh \
            apps/pandora-mobile \
            .github/workflows/pandora-mobile-integration.yml
          python3 -m unittest discover \
            -s apps/pandora-mobile/tool \
            -p 'test_*.py'

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Materialize disposable iOS platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-ios-build
          mkdir .pandora-mobile-ios-build
          cd .pandora-mobile-ios-build
          flutter create \
            --platforms=ios \
            --org com.banataosystems \
            --project-name pandora_mobile \
            .
          cp -R ../apps/pandora-mobile/platform/ios/. ./ios/
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp -R ../apps/pandora-mobile/platform ./platform
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          python3 ../apps/pandora-mobile/tool/configure_validation_ios.py \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Resolve the exact lockfile
        working-directory: .pandora-mobile-ios-build
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock

      - name: Format
        working-directory: .pandora-mobile-ios-build
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: .pandora-mobile-ios-build
        run: flutter analyze

      - name: Test non-golden suite
        working-directory: .pandora-mobile-ios-build
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          while IFS= read -r -d '' file; do
            tests+=("$file")
          done < <(
            find test -type f -name '*_test.dart' \
              ! -path 'test/goldens/*' \
              -print0
          )
          test "${#tests[@]}" -gt 0
          flutter test --reporter expanded "${tests[@]}"

      - name: Build non-production iOS simulator candidate
        working-directory: .pandora-mobile-ios-build
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/{print $2; exit}' pubspec.yaml)" = \
            "$EXPECTED_APP_VERSION"
          xcodebuild -version
          flutter build ios --simulator --debug \
            --dart-define=PANDORA_SOURCE_REVISION="$SOURCE_SHA" \
            --dart-define=PANDORA_APP_VERSION="$EXPECTED_APP_VERSION"
          test -d build/ios/iphonesimulator/Runner.app
