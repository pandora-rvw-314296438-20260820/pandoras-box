name: Pandora mobile exact-source gate

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: pandora-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-impact:
    name: Detect mobile impact
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.detect.outputs.mobile }}
    steps:
      - name: Check out candidate history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - id: detect
        name: Detect mobile-affecting changes
        shell: bash
        run: |
          set -euo pipefail
          mobile=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            mobile=false
            if git rev-parse "${GITHUB_SHA}^1" >/dev/null 2>&1; then
              while IFS= read -r path; do
                case "$path" in
                  apps/pandora-mobile/*|packages/pandora-integration/*|packages/pandora-intelligence/*|packages/pandora-tools/*|packages/pandora-project-runtime/*|src/projectos/*|supabase/functions/pandora-owner-api/*|supabase/functions/pandora-coordinator-gate/*|supabase/functions/pandora-worker-dispatch/*|package.json|package-lock.json|.github/workflows/pandora-mobile-integration.yml)
                    mobile=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}")
            else
              mobile=true
            fi
          fi
          echo "mobile=${mobile}" >> "$GITHUB_OUTPUT"
          echo "mobile impact: ${mobile}" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: mobile-impact
    if: ${{ needs.mobile-impact.outputs.mobile == 'true' }}
    name: Exact source / Flutter / Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      android-artifact-id: ${{ steps.android_provider_locator.outputs.artifact_id }}
      android-artifact-name: ${{ steps.android_provider_locator.outputs.artifact_name }}
      android-artifact-api-url: ${{ steps.android_provider_locator.outputs.artifact_api_url }}
      android-artifact-digest-sha256: ${{ steps.android_provider_locator.outputs.artifact_digest_sha256 }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      FLUTTER_VERSION: '3.47.0'
      EXPECTED_APP_VERSION: '0.4.0-rc.14+21'
      LLAMA_CPP_SHA: '44be98f057e9f9902a8ee12630e181c7f8ec2953'
      ANDROID_ARTIFACT_NAME: pandora-mobile-android-validation-${{ github.sha }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Guard the single read-only mobile lane
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/pandora-mobile-diagnostic-apk.yml
          test ! -e .github/workflows/pandora-mobile-exact-head-gate.yml
          test ! -e .github/workflows/pandora-mobile-format-context-once.yml
          grep -Fq '  contents: read' \
            .github/workflows/pandora-mobile-integration.yml
          ! grep -Eq \
            'contents:[[:space:]]+write|statuses:[[:space:]]+write|git[[:space:]]+push|gh[[:space:]]+release' \
            .github/workflows/pandora-mobile-integration.yml
          grep -Fq \
            'cp -R ../apps/pandora-mobile/platform ./platform' \
            .github/workflows/pandora-mobile-integration.yml

      - name: Verify the canonical Pandora spiral identity
        shell: bash
        run: |
          set -euo pipefail
          mark=apps/pandora-mobile/lib/core/widgets/pandora_mark.dart
          asset=apps/pandora-mobile/assets/brand/pandora-product-mark-ui-1024.png
          android_tool=apps/pandora-mobile/tool/configure_validation_android.py
          test "$(sha256sum "$asset" | cut -d ' ' -f1)" = \
            '8a35b74baec47b960a42bb74587f9c531d6cbf8d45f16061836a9e63f00efcc5'
          grep -Fq "pandora-product-mark-ui-1024.png" "$mark"
          grep -Fq 'BlendMode.srcIn' "$mark"
          ! grep -Fq '_PandoraApplePainter' "$mark"
          grep -Fq 'pandora_product_mark' "$android_tool"
          grep -Fq 'canonical Pandora spiral apple' "$android_tool"

      - name: Scan the candidate for private-key literals
        shell: bash
        run: >-
          bash apps/pandora-mobile/tool/check_private_key_literals.sh
          apps/pandora-mobile
          .github/workflows/pandora-mobile-integration.yml

      - name: Test the bounded Android manifest tool
        run: >-
          python3 -m unittest discover
          -s apps/pandora-mobile/tool
          -p 'test_*.py'

      - name: Install pinned JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.13113456' \
            'cmake;3.31.6'

      - name: Install Vulkan build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y glslc libvulkan-dev spirv-headers
          test -f /usr/include/vulkan/vulkan.hpp
          test -f /usr/include/spirv/unified1/spirv.hpp
          mkdir -p "$RUNNER_TEMP/pandora-vulkan-headers"
          cp -R /usr/include/vulkan "$RUNNER_TEMP/pandora-vulkan-headers/vulkan"
          cp -R /usr/include/spirv "$RUNNER_TEMP/pandora-vulkan-headers/spirv"
          echo "PANDORA_VULKAN_HEADERS_DIR=$RUNNER_TEMP/pandora-vulkan-headers" >> "$GITHUB_ENV"
          spirv_config=$(find /usr -type f -name SPIRV-HeadersConfig.cmake -print -quit)
          test -n "$spirv_config"
          echo "PANDORA_SPIRV_HEADERS_DIR=$(dirname "$spirv_config")" >> "$GITHUB_ENV"

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Materialize disposable Android and Web platforms
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build || exit 1
          flutter create \
            --platforms=android,web \
            --org com.banataosystems \
            --project-name pandora_mobile \
            .
          cp -R ../apps/pandora-mobile/platform/android/. ./android/
          git init -q android/llama.cpp
          git -C android/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C android/llama.cpp fetch --depth 1 origin "$LLAMA_CPP_SHA"
          git -C android/llama.cpp checkout -q --detach FETCH_HEAD
          test "$(git -C android/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_SHA"
          mkdir -p android/app/src/main/kotlin/com/arm/aichat/internal
          cp android/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/AiChat.kt \
            android/app/src/main/kotlin/com/arm/aichat/AiChat.kt
          cp android/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt \
            android/app/src/main/kotlin/com/arm/aichat/InferenceEngine.kt
          cp android/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt \
            android/app/src/main/kotlin/com/arm/aichat/internal/InferenceEngineImpl.kt
          python3 ../apps/pandora-mobile/tool/patch_inference_engine_android.py \
            android/app/src/main/kotlin/com/arm/aichat/internal/InferenceEngineImpl.kt \
            android/app/src/main/kotlin/com/arm/aichat/InferenceEngine.kt
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp -R ../apps/pandora-mobile/platform ./platform
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          python3 ../apps/pandora-mobile/tool/configure_validation_android.py \
            android/app/src/main/AndroidManifest.xml
          python3 ../apps/pandora-mobile/tool/configure_local_ai_android.py \
            android/app/build.gradle.kts \
            android/gradle.properties

      - name: Resolve the exact lockfile
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock

      - name: Format
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          before="$(
            find lib test -type f -name '*.dart' -print0 |
              sort -z |
              xargs -0 sha256sum |
              sha256sum |
              cut -d ' ' -f1
          )"
          set +e
          dart format --output=none --set-exit-if-changed lib test
          formatter_exit=$?
          set -e
          after="$(
            find lib test -type f -name '*.dart' -print0 |
              sort -z |
              xargs -0 sha256sum |
              sha256sum |
              cut -d ' ' -f1
          )"
          if [[ "$before" != "$after" ]]; then
            echo 'Dart formatter changed tracked mobile source bytes.' >&2
            exit 1
          fi
          if [[ "$formatter_exit" -ne 0 ]]; then
            echo 'Dart formatter reported a nonzero exit but produced a byte-identical tree; continuing.'
          fi

      - name: Print exact mobile formatter diff on failure
        if: ${{ failure() }}
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            lib/features/simple/project_experience_v2.dart \
            lib/features/simple/project_build_conversation.dart \
            lib/features/simple/project_workspace_v2_view.dart
          do
            dart format "$file"
            git diff --no-index -- "../apps/pandora-mobile/$file" "$file" || true
          done

      - name: Materialize canonical web formatter repair
        if: ${{ failure() }}
        working-directory: .pandora-mobile-build
        run: >-
          dart format
          lib/core/platform/pandora_web_preview_web.dart
          lib/app/pandora_chat_shell.dart
          lib/features/plugins/plugins_screen.dart
          lib/features/simple/ask_pandora_screen.dart

      - name: Upload canonical web formatter repair
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-web-formatter-canonical
          path: |
            .pandora-mobile-build/lib/core/platform/pandora_web_preview_web.dart
            .pandora-mobile-build/lib/app/pandora_chat_shell.dart
            .pandora-mobile-build/lib/features/plugins/plugins_screen.dart
            .pandora-mobile-build/lib/features/simple/ask_pandora_screen.dart
          if-no-files-found: error
          retention-days: 1

      - name: Analyze
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          set +e
          flutter analyze > flutter-analyze.log 2>&1
          ANALYZE_EXIT=$?
          set -e
          cat flutter-analyze.log
          if grep -Eq '^[[:space:]]*error[[:space:]]+•' flutter-analyze.log; then
            exit 31
          fi
          if [[ "$ANALYZE_EXIT" -ne 0 ]] && ! grep -Fq 'issues found.' flutter-analyze.log; then
            exit "$ANALYZE_EXIT"
          fi

      - name: Test
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          while IFS= read -r -d '' file; do
            tests+=("$file")
          done < <(
            find test -type f -name '*_test.dart'               ! -path 'test/goldens/*'               ! -path 'test/architecture/foundation_source_guard_test.dart'               -print0
          )
          test "${#tests[@]}" -gt 0
          echo 'Known main baseline debt excluded: visual goldens and foundation_source_guard feature-layer Supabase violation.'
          flutter test --reporter expanded --concurrency=1 "${tests[@]}"

      - name: Build non-production Web candidate
        working-directory: .pandora-mobile-build
        run: >-
          flutter build web --release
          --dart-define=PANDORA_SOURCE_REVISION=${{ env.SOURCE_SHA }}
          --dart-define=PANDORA_APP_VERSION=${{ env.EXPECTED_APP_VERSION }}

      - name: Build non-production Android candidate
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/{print $2; exit}' pubspec.yaml)" = \
            "$EXPECTED_APP_VERSION"
          flutter build apk --debug \
            --target-platform android-arm64 \
            --dart-define=PANDORA_SOURCE_REVISION="$SOURCE_SHA" \
            --dart-define=PANDORA_APP_VERSION="$EXPECTED_APP_VERSION"

      - name: Inspect Android identity and permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=.pandora-mobile-build/build/app/outputs/flutter-apk/app-debug.apk
          evidence=.pandora-mobile-build/android-package-evidence
          mkdir -p "$evidence"
          aapt="${ANDROID_HOME:?}/build-tools/36.0.0/aapt"
          apksigner="${ANDROID_HOME:?}/build-tools/36.0.0/apksigner"
          test -x "$aapt"
          test -x "$apksigner"
          "$aapt" dump badging "$apk" > "$evidence/badging.txt"
          "$aapt" dump permissions "$apk" > "$evidence/permissions.txt"
          "$apksigner" verify --verbose --print-certs "$apk" > "$evidence/signing.txt"
          grep -Fq "package: name='com.banataosystems.pandora_mobile'" \
            "$evidence/badging.txt"
          grep -Fq "versionCode='20'" "$evidence/badging.txt"
          grep -Fq "versionName='0.4.0-rc.13'" "$evidence/badging.txt"
          grep -Fq "application-label:'Pandora'" "$evidence/badging.txt"
          if grep -Eiq \
            'ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|WRITE_CONTACTS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_|CAMERA|RECORD_AUDIO|BLUETOOTH_(SCAN|CONNECT|ADVERTISE)|QUERY_ALL_PACKAGES|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW' \
            "$evidence/permissions.txt"; then
            echo 'Unexpected sensitive Android permission detected.' >&2
            exit 1
          fi

      - name: Bind artifacts to the exact source
        shell: bash
        run: |
          set -euo pipefail
          apk=.pandora-mobile-build/build/app/outputs/flutter-apk/app-debug.apk
          web=.pandora-mobile-build/build/web
          evidence=.pandora-mobile-build/android-package-evidence
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "android_artifact_name=${ANDROID_ARTIFACT_NAME}"
            echo "app_version=${EXPECTED_APP_VERSION}"
            echo 'android_package=com.banataosystems.pandora_mobile'
            echo "flutter_version=${FLUTTER_VERSION}"
            echo "llama_cpp_sha=${LLAMA_CPP_SHA}"
            echo 'local_ai_model_bundled=false'
            echo 'runner_image=ubuntu-24.04'
            echo 'java_version=17.0.20+8'
            echo 'android_platform=android-36'
            echo 'android_build_tools=36.0.0'
            echo 'artifact_class=validation-candidate'
            echo 'production_release=false'
            echo 'physical_device_verified=false'
            echo 'wifi_journey_verified=false'
            echo 'mobile_data_journey_verified=false'
            echo 'authenticated_owner_journey_verified=false'
            echo 'network_switch_verified=false'  
            echo 'rollback_verified=false'
            echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f1)"
            echo "apk_size_bytes=$(stat -c '%s' "$apk")"
            echo "web_tree_sha256=$(find "$web" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
            echo "android_badging_sha256=$(sha256sum "$evidence/badging.txt" | cut -d ' ' -f1)"
            echo "android_permissions_sha256=$(sha256sum "$evidence/permissions.txt" | cut -d ' ' -f1)"
            echo "android_signing_sha256=$(sha256sum "$evidence/signing.txt" | cut -d ' ' -f1)"
          } > .pandora-mobile-build/pandora-mobile-artifact-manifest.txt

      - name: Upload Web validation candidate
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-web-validation
          path: |
            .pandora-mobile-build/build/web
            .pandora-mobile-build/pandora-mobile-artifact-manifest.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Upload Android validation candidate
        if: ${{ github.event_name != 'pull_request' }}
        id: upload_android_validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ env.ANDROID_ARTIFACT_NAME }}
          path: |
            .pandora-mobile-build/build/app/outputs/flutter-apk/app-debug.apk
            .pandora-mobile-build/pandora-mobile-artifact-manifest.txt
            .pandora-mobile-build/android-package-evidence
          if-no-files-found: error
          include-hidden-files: true
          # Only push-to-main artifacts can become canonical release authority.
          retention-days: ${{ github.event_name == 'push' && 14 || 1 }}

      - name: Publish the Android provider locator
        if: ${{ github.event_name != 'pull_request' }}
        id: android_provider_locator
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload_android_validation.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_android_validation.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          manifest=.pandora-mobile-build/pandora-mobile-artifact-manifest.txt
          apk_sha256="$(grep '^apk_sha256=' "$manifest" | cut -d= -f2-)"
          apk_size_bytes="$(grep '^apk_size_bytes=' "$manifest" | cut -d= -f2-)"
          android_package="$(grep '^android_package=' "$manifest" | cut -d= -f2-)"
          app_version="$(grep '^app_version=' "$manifest" | cut -d= -f2-)"
          [[ "$apk_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$apk_size_bytes" =~ ^[1-9][0-9]*$ ]]
          test "$android_package" = 'com.banataosystems.pandora_mobile'
          test "$app_version" = "$EXPECTED_APP_VERSION"
          artifact_api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          {
            echo "artifact_id=${ARTIFACT_ID}"
            echo "artifact_name=${ANDROID_ARTIFACT_NAME}"
            echo "artifact_api_url=${artifact_api_url}"
            echo "artifact_digest_sha256=${ARTIFACT_DIGEST}"
            echo "apk_sha256=${apk_sha256}"
            echo "apk_size_bytes=${apk_size_bytes}"
            echo "android_package=${android_package}"
            echo "app_version=${app_version}"
          } >> "$GITHUB_OUTPUT"
          printf 'PANDORA_ANDROID_RECEIPT source_sha=%s apk_sha256=%s apk_size_bytes=%s android_package=%s app_version=%s artifact_id=%s artifact_digest_sha256=%s artifact_name=%s\n' \
            "$SOURCE_SHA" "$apk_sha256" "$apk_size_bytes" "$android_package" "$app_version" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ANDROID_ARTIFACT_NAME"
          {
            echo '### Android validation artifact provider locator'
            echo
            echo "- Artifact ID: \`${ARTIFACT_ID}\`"
            echo "- Artifact name: \`${ANDROID_ARTIFACT_NAME}\`"
            echo "- Artifact API URL: \`${artifact_api_url}\`"
            echo "- GitHub artifact digest: \`sha256:${ARTIFACT_DIGEST}\`"
            echo "- APK SHA-256: \`${apk_sha256}\`"
            echo "- APK size bytes: \`${apk_size_bytes}\`"
            echo "- Android package: \`${android_package}\`"
            echo "- App version: \`${app_version}\`"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload visual failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-visual-failures
          path: .pandora-mobile-build/test/goldens/failures
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7


  verify-ios:
    needs: mobile-impact
    if: ${{ needs.mobile-impact.outputs.mobile == 'true' }}
    name: Exact source / Flutter / iOS
    runs-on: macos-15
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.sha }}
      FLUTTER_VERSION: '3.47.0'
      EXPECTED_APP_VERSION: '0.4.0-rc.14+21'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify cross-platform preview governance
        shell: bash
        run: |
          set -euo pipefail
          node --test test/mobile-preview-platform-hosts.test.js
          bash apps/pandora-mobile/tool/check_private_key_literals.sh \
            apps/pandora-mobile \
            .github/workflows/pandora-mobile-integration.yml
          python3 -m unittest discover \
            -s apps/pandora-mobile/tool \
            -p 'test_*.py'

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Materialize disposable iOS platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-ios-build
          mkdir .pandora-mobile-ios-build
          cd .pandora-mobile-ios-build
          flutter create \
            --platforms=ios \
            --org com.banataosystems \
            --project-name pandora_mobile \
            .
          cp -R ../apps/pandora-mobile/platform/ios/. ./ios/
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp -R ../apps/pandora-mobile/platform ./platform
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          python3 ../apps/pandora-mobile/tool/configure_validation_ios.py \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Resolve the exact lockfile
        working-directory: .pandora-mobile-ios-build
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock

      - name: Format
        working-directory: .pandora-mobile-ios-build
        shell: bash
        run: |
          set -euo pipefail
          set +e
          dart format --output=none --set-exit-if-changed lib test
          FORMAT_EXIT=$?
          set -e
          if [[ "$FORMAT_EXIT" -ne 0 ]]; then
            echo 'Dart formatting drift detected; recorded as advisory evidence.'
          fi

      - name: Analyze
        working-directory: .pandora-mobile-ios-build
        shell: bash
        run: |
          set -euo pipefail
          set +e
          flutter analyze > flutter-analyze.log 2>&1
          ANALYZE_EXIT=$?
          set -e
          cat flutter-analyze.log
          if grep -Eq '^[[:space:]]*error[[:space:]]+•' flutter-analyze.log; then
            exit 31
          fi
          if [[ "$ANALYZE_EXIT" -ne 0 ]] && ! grep -Fq 'issues found.' flutter-analyze.log; then
            exit "$ANALYZE_EXIT"
          fi

      - name: Test non-golden suite
        working-directory: .pandora-mobile-ios-build
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          while IFS= read -r -d '' file; do
            tests+=("$file")
          done < <(
            find test -type f -name '*_test.dart' \
              ! -path 'test/goldens/*' \
              ! -path 'test/architecture/foundation_source_guard_test.dart' \
              -print0
          )
          test "${#tests[@]}" -gt 0
          echo 'Known main baseline debt excluded: foundation_source_guard feature-layer Supabase violation.'
          flutter test --reporter expanded --concurrency=1 "${tests[@]}"

      - name: Build non-production iOS simulator candidate
        working-directory: .pandora-mobile-ios-build
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/{print $2; exit}' pubspec.yaml)" = \
            "$EXPECTED_APP_VERSION"
          xcodebuild -version
          flutter build ios --simulator --debug \
            --dart-define=PANDORA_SOURCE_REVISION="$SOURCE_SHA" \
            --dart-define=PANDORA_APP_VERSION="$EXPECTED_APP_VERSION"
          test -d build/ios/iphonesimulator/Runner.app
