name: Pandora mobile exact-source gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pandora-mobile-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Exact source / Flutter / Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      FLUTTER_VERSION: '3.47.0'
    steps:
      - name: Check out the exact provider candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Materialize disposable Flutter platforms
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test pubspec.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
      - name: Resolve dependencies
        working-directory: .pandora-mobile-build
        run: flutter pub get
      - name: Analyze
        working-directory: .pandora-mobile-build
        run: flutter analyze
      - name: Test
        working-directory: .pandora-mobile-build
        run: flutter test
      - name: Build web
        working-directory: .pandora-mobile-build
        run: flutter build web --release
      - name: Build Android debug APK
        working-directory: .pandora-mobile-build
        run: flutter build apk --debug
      - name: Upload web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pandora-mobile-web-validation-${{ env.SOURCE_SHA }}
          path: .pandora-mobile-build/build/web
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pandora-mobile-android-validation-${{ env.SOURCE_SHA }}
          path: .pandora-mobile-build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Confirm validation did not mutate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          test -z "$(git status --porcelain --untracked-files=all)"
