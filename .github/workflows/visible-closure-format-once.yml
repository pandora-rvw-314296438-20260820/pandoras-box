name: Visible Closure Format Once

on:
  push:
    branches:
      - visible/closure-current-main-20260902

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: visible/closure-current-main-20260902
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Canonical Dart format and self-remove
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/pandora-mobile/lib/core/models/project_source_models.dart apps/pandora-mobile/lib/features/simple/project_history_screen.dart apps/pandora-mobile/lib/features/simple/project_source_files_screen.dart
          rm .github/workflows/visible-closure-format-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/pandora-mobile/lib/core/models/project_source_models.dart apps/pandora-mobile/lib/features/simple/project_history_screen.dart apps/pandora-mobile/lib/features/simple/project_source_files_screen.dart .github/workflows/visible-closure-format-once.yml
          git commit -m "style(mobile): canonical format visible closure files"
          git push origin HEAD:visible/closure-current-main-20260902
