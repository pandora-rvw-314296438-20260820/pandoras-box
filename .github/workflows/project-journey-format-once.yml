name: Project Journey exact formatter
on:
  push:
    branches:
      - feature/customer-project-journey-vercel-20260828
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Resolve exact package and export formatting
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-format
          mkdir .pandora-mobile-format
          cd .pandora-mobile-format
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          files=(
            lib/core/data/project_runtime_api.dart
            lib/core/models/project_journey_models.dart
            lib/features/simple/business_screen.dart
            lib/features/simple/project_journey_flow.dart
            lib/features/simple/projects_screen.dart
          )
          dart format "${files[@]}"
          for file in "${files[@]}"; do
            echo "FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_END:$file"
          done
