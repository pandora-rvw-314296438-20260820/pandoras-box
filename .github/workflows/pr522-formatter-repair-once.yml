name: PR 522 formatter repair both changed Dart files

on:
  push:
    branches:
      - feat/contextual-chat-composer-20260912
    paths:
      - .github/workflows/pr522-formatter-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/contextual-chat-composer-20260912
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Format exact changed Dart sources and self-remove
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/pandora-mobile/lib/core/data/pandora_intelligence_api.dart apps/pandora-mobile/lib/features/simple/ask_pandora_screen.dart
          rm .github/workflows/pr522-formatter-repair-once.yml
          git config user.name 'Pandora ProjectOS'
          git config user.email 'projectos@users.noreply.github.com'
          git add apps/pandora-mobile/lib/core/data/pandora_intelligence_api.dart apps/pandora-mobile/lib/features/simple/ask_pandora_screen.dart .github/workflows/pr522-formatter-repair-once.yml
          git diff --cached --check
          git commit -m 'style(mobile): format contextual composer sources'
          git push origin HEAD:feat/contextual-chat-composer-20260912
