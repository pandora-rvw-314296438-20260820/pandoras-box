name: Engineering toolchain

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "tooling/**"
      - "src/projectos/pandora-lifecycle.js"
      - "src/projectos/pandora-posthog-*.js"
      - "test/pandora-lifecycle.test.js"
      - "test/pandora-posthog-transport.test.js"
      - "supabase/**"
      - "scripts/check-supabase-syntax.mjs"
      - "scripts/verify-supabase-hardening.mjs"
      - "scripts/replay-supabase-migrations.mjs"
      - "docs/development/ENGINEERING_TOOLCHAIN.md"
      - ".github/workflows/engineering-toolchain.yml"

permissions:
  contents: read

jobs:
  project-tools:
    name: Project toolchain smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Pandora runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned engineering tools
        run: npm ci --prefix tooling --ignore-scripts --no-audit --no-fund

      - name: Verify project and provider CLIs
        run: npm run tooling:verify

      - name: Audit isolated engineering dependencies
        run: npm run tooling:audit

      - name: Verify PostHog privacy and transport contract
        run: npm run posthog:contract

      - name: Verify Supabase repository contract
        run: npm run supabase:contract

      - name: Verify MCP contract with Inspector
        run: npm run mcp:inspect

      - name: Run scoped Biome lint gate
        run: npm run quality:biome

      - name: Install Chromium
        run: npm run playwright:install

      - name: Run Playwright smoke
        run: npm run test:e2e:smoke

      - name: Knip report
        continue-on-error: true
        run: npm run quality:dead-code

  workflow-lint:
    name: actionlint and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint and ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify versions
        run: |
          actionlint -version
          shellcheck --version

      - name: Lint this workflow strictly
        run: actionlint -color .github/workflows/engineering-toolchain.yml

      - name: Report existing workflow debt
        continue-on-error: true
        run: actionlint -color

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-${version}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan repository history
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            gitleaks git --redact --no-banner --exit-code 1 --log-opts="$base..$head" .
          else
            gitleaks git --redact --no-banner --exit-code 1 .
          fi

  vulnerability-scan:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan dependencies, config, and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
