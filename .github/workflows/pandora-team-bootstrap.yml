name: Pandora Team one-shot implementation

on:
  push:
    branches:
      - fix/canonical-working-ui-screenshot-fidelity-20260826
    paths:
      - .github/workflows/pandora-team-bootstrap.yml
      - scripts/pandora-team-bootstrap.zip

concurrency:
  group: pandora-team-bootstrap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  implement:
    if: ${{ contains(github.event.head_commit.message || '', 'bootstrap(team):') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: '3.47.0'
      EXPECTED_APP_VERSION: '0.3.0-rc.3+6'
    steps:
      - name: Check out exact bootstrap source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Expand verified implementation package
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum scripts/pandora-team-bootstrap.zip | cut -d ' ' -f1)" = \
            'bee7f3ca45097c3214c123891d7b0effc66e2a2aae0395466afa42f7014750b0'
          unzip -o scripts/pandora-team-bootstrap.zip -d .

      - name: Verify bootstrap branch and source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'fix/canonical-working-ui-screenshot-fidelity-20260826'
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f scripts/pandora_team_bootstrap.py
          test -f scripts/pandora-user-admin-source-parity.patch

      - name: Install pinned JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0'

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate complete Team implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/pandora_team_bootstrap.py')
          source = path.read_text()
          old = r"assert.match(fn, /auth\.admin\.inviteUserByEmail/);"
          new = r"assert.match(fn, /auth\.admin\s*\.inviteUserByEmail/);"
          if source.count(old) != 1:
              raise SystemExit('expected contract matcher was not found exactly once')
          path.write_text(source.replace(old, new, 1))
          PY
          python3 scripts/pandora_team_bootstrap.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f'{path}: expected lint target exactly once')
              path.write_text(source.replace(old, new, 1))

          api = Path('apps/pandora-mobile/lib/features/team/pandora_user_admin_api.dart')
          old_api = '\n'.join([
              "  if (error.status == 401) return 'Sign in again to manage your team.';",
              "  if (error.status == 403) return 'You do not have permission to manage this team.';",
              "  if (error.status == 429) return 'Too many requests. Try again shortly.';",
          ])
          new_api = '\n'.join([
              "  if (error.status == 401) {",
              "    return 'Sign in again to manage your team.';",
              "  }",
              "  if (error.status == 403) {",
              "    return 'You do not have permission to manage this team.';",
              "  }",
              "  if (error.status == 429) {",
              "    return 'Too many requests. Try again shortly.';",
              "  }",
          ])
          replace_once(api, old_api, new_api)

          screen = Path('apps/pandora-mobile/lib/features/team/team_screen.dart')
          old_screen = "      if (mounted) setState(() => _inviting = false);"
          new_screen = '\n'.join([
              "      if (mounted) {",
              "        setState(() => _inviting = false);",
              "      }",
          ])
          replace_once(screen, old_screen, new_screen)
          old_timezone = "                if (timezone.length > 64) return 'Keep the timezone under 64 characters.';"
          new_timezone = '\n'.join([
              "                if (timezone.length > 64) {",
              "                  return 'Keep the timezone under 64 characters.';",
              "                }",
          ])
          replace_once(screen, old_timezone, new_timezone)

          widget_test = Path('apps/pandora-mobile/test/features/team/team_screen_test.dart')
          old_imports = '\n'.join([
              "import 'package:pandora_mobile/features/team/pandora_user_admin_api.dart';",
              "import 'package:pandora_mobile/features/simple/more_screen.dart';",
          ])
          new_imports = '\n'.join([
              "import 'package:pandora_mobile/core/data/pandora_user_admin_api.dart';",
              "import 'package:pandora_mobile/features/simple/more_screen.dart';",
          ])
          replace_once(widget_test, old_imports, new_imports)

          replace_once(
              screen,
              "  Widget build(BuildContext context) => PandoraPage(",
              "  Widget build(BuildContext context) => Scaffold(\n        body: PandoraPage(",
          )
          old_build_end = '\n'.join([
              "        child: _buildBody(context),",
              "      );",
              "",
              "  Widget _buildBody(BuildContext context) {",
          ])
          new_build_end = '\n'.join([
              "          child: _buildBody(context),",
              "        ),",
              "      );",
              "",
              "  Widget _buildBody(BuildContext context) {",
          ])
          replace_once(screen, old_build_end, new_build_end)

          old_navigation = '\n'.join([
              "    expect(find.text('Team'), findsOneWidget);",
              "    await tester.tap(find.text('Team'));",
          ])
          new_navigation = '\n'.join([
              "    expect(find.text('Team'), findsOneWidget);",
              "    await tester.ensureVisible(find.text('Team'));",
              "    await tester.pumpAndSettle();",
              "    await tester.tap(find.text('Team'));",
          ])
          replace_once(widget_test, old_navigation, new_navigation)

          core_api = Path('apps/pandora-mobile/lib/core/data/pandora_user_admin_api.dart')
          core_api.parent.mkdir(parents=True, exist_ok=True)
          if core_api.exists():
              raise SystemExit('core Team gateway already exists unexpectedly')
          core_api.write_text(api.read_text())
          api.unlink()

          screen_source = screen.read_text()
          old_screen_import = "import 'pandora_user_admin_api.dart';\n"
          core_screen_import = "import '../../core/data/pandora_user_admin_api.dart';\n"
          if screen_source.count(old_screen_import) != 1:
              raise SystemExit('Team screen gateway import anchor missing')
          screen_source = screen_source.replace(old_screen_import, '', 1)
          screen_anchor = "import 'package:flutter/material.dart';\n\n"
          if screen_source.count(screen_anchor) != 1:
              raise SystemExit('Team screen import anchor missing')
          screen.write_text(
              screen_source.replace(screen_anchor, screen_anchor + core_screen_import, 1)
          )

          more = Path('apps/pandora-mobile/lib/features/simple/more_screen.dart')
          more_source = more.read_text()
          old_more_import = "import '../team/pandora_user_admin_api.dart';\n"
          core_more_import = "import '../../core/data/pandora_user_admin_api.dart';\n"
          if more_source.count(old_more_import) != 1:
              raise SystemExit('More screen gateway import anchor missing')
          more_source = more_source.replace(old_more_import, '', 1)
          more_anchor = "import 'package:flutter/material.dart';\n\n"
          if more_source.count(more_anchor) != 1:
              raise SystemExit('More screen import anchor missing')
          more.write_text(
              more_source.replace(more_anchor, more_anchor + core_more_import, 1)
          )

          model_test = Path('apps/pandora-mobile/test/features/team/pandora_user_admin_api_test.dart')
          replace_once(
              model_test,
              "package:pandora_mobile/features/team/pandora_user_admin_api.dart",
              "package:pandora_mobile/core/data/pandora_user_admin_api.dart",
          )

          node_contract = Path('test/pandora-team-mobile-contract.test.js')
          replace_once(
              node_contract,
              'apps/pandora-mobile/lib/features/team/pandora_user_admin_api.dart',
              'apps/pandora-mobile/lib/core/data/pandora_user_admin_api.dart',
          )

          version_contract = Path('apps/pandora-mobile/test/pandora_contract_test.dart')
          replace_once(version_contract, "'0.3.0-rc.2+5'", "'0.3.0-rc.3+6'")

          manifest = Path('docs/evidence/pandora_team_implementation_manifest.json')
          replace_once(
              manifest,
              'apps/pandora-mobile/lib/features/team/pandora_user_admin_api.dart',
              'apps/pandora-mobile/lib/core/data/pandora_user_admin_api.dart',
          )
          PY
      - name: Resolve exact mobile dependencies before canonical formatting
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          rm pubspec.lock.expected

      - name: Canonically format Flutter source
        run: dart format apps/pandora-mobile/lib apps/pandora-mobile/test

      - name: Update reviewed settings release-version golden
        working-directory: apps/pandora-mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter test --update-goldens \
            --plain-name 'captures settings_porcelain_390x844' \
            test/goldens/owner_screens_visual_evidence_test.dart

      - name: Verify source contracts before commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --test \
            test/pandora-user-admin-contract.test.js \
            test/pandora-team-mobile-contract.test.js
          test -f supabase/functions/pandora-user-admin/index.ts
          test -f apps/pandora-mobile/lib/features/team/team_screen.dart
          test -f apps/pandora-mobile/lib/core/data/pandora_user_admin_api.dart
          test ! -e .github/workflows/pandora-team-bootstrap.yml
          test ! -e scripts/pandora_team_bootstrap.py
          test ! -e scripts/pandora-user-admin-source-parity.patch
          test ! -e scripts/pandora-team-bootstrap.zip

      - name: Commit exact candidate locally
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name pandora-rvw-314296438-20260820
          git config user.email plpboracay@gmail.com
          git add -A
          git commit -m 'feat(team): implement governed user management and rc.3'
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
          echo "sha=${candidate_sha}" >> "$GITHUB_OUTPUT"
          echo "tree=${candidate_tree}" >> "$GITHUB_OUTPUT"

      - name: Materialize disposable Android and Web platforms
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pandora-team-build
          mkdir /tmp/pandora-team-build
          cd /tmp/pandora-team-build
          flutter create \
            --platforms=android,web \
            --org com.banataosystems \
            --project-name pandora_mobile \
            .
          cp -R "$GITHUB_WORKSPACE/apps/pandora-mobile/platform/android/." ./android/
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R "$GITHUB_WORKSPACE/apps/pandora-mobile/lib" ./lib
          cp -R "$GITHUB_WORKSPACE/apps/pandora-mobile/test" ./test
          cp -R "$GITHUB_WORKSPACE/apps/pandora-mobile/assets" ./assets
          cp -R "$GITHUB_WORKSPACE/apps/pandora-mobile/platform" ./platform
          cp "$GITHUB_WORKSPACE/apps/pandora-mobile/pubspec.yaml" ./pubspec.yaml
          cp "$GITHUB_WORKSPACE/apps/pandora-mobile/pubspec.lock" ./pubspec.lock
          cp "$GITHUB_WORKSPACE/apps/pandora-mobile/analysis_options.yaml" ./analysis_options.yaml
          python3 "$GITHUB_WORKSPACE/apps/pandora-mobile/tool/configure_validation_android.py" \
            android/app/src/main/AndroidManifest.xml

      - name: Resolve exact dependencies
        working-directory: /tmp/pandora-team-build
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          rm pubspec.lock.expected

      - name: Verify formatting
        working-directory: /tmp/pandora-team-build
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: /tmp/pandora-team-build
        run: flutter analyze

      - name: Test
        working-directory: /tmp/pandora-team-build
        run: flutter test --reporter expanded

      - name: Build Android APK
        working-directory: /tmp/pandora-team-build
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(awk '/^version:/{print $2; exit}' pubspec.yaml)" = "$EXPECTED_APP_VERSION"
          flutter build apk --debug \
            --dart-define=PANDORA_SOURCE_REVISION="$CANDIDATE_SHA" \
            --dart-define=PANDORA_APP_VERSION="$EXPECTED_APP_VERSION"

      - name: Inspect APK identity and permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=/tmp/pandora-team-build/build/app/outputs/flutter-apk/app-debug.apk
          evidence=/tmp/pandora-team-build/android-package-evidence
          mkdir -p "$evidence"
          aapt="${ANDROID_HOME:?}/build-tools/36.0.0/aapt"
          apksigner="${ANDROID_HOME:?}/build-tools/36.0.0/apksigner"
          "$aapt" dump badging "$apk" > "$evidence/badging.txt"
          "$aapt" dump permissions "$apk" > "$evidence/permissions.txt"
          "$apksigner" verify --verbose --print-certs "$apk" > "$evidence/signing.txt"
          grep -Fq "package: name='com.banataosystems.pandora_mobile'" "$evidence/badging.txt"
          grep -Fq "versionCode='6'" "$evidence/badging.txt"
          grep -Fq "versionName='0.3.0-rc.3'" "$evidence/badging.txt"
          grep -Fq "application-label:'Pandora'" "$evidence/badging.txt"
          if grep -Eiq \
            'ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|READ_CONTACTS|WRITE_CONTACTS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_|CAMERA|RECORD_AUDIO|BLUETOOTH_(SCAN|CONNECT|ADVERTISE)|QUERY_ALL_PACKAGES|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW' \
            "$evidence/permissions.txt"; then
            echo 'Unexpected sensitive Android permission detected.' >&2
            exit 1
          fi

      - name: Bind APK to exact candidate source
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.tree }}
        run: |
          set -euo pipefail
          apk=/tmp/pandora-team-build/build/app/outputs/flutter-apk/app-debug.apk
          evidence=/tmp/pandora-team-build/android-package-evidence
          {
            echo "source_sha=${CANDIDATE_SHA}"
            echo "source_tree=${CANDIDATE_TREE}"
            echo "app_version=${EXPECTED_APP_VERSION}"
            echo "flutter_version=${FLUTTER_VERSION}"
            echo 'artifact_class=owner-test-team-candidate'
            echo 'production_release=false'
            echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f1)"
            echo "apk_size_bytes=$(stat -c '%s' "$apk")"
            echo "badging_sha256=$(sha256sum "$evidence/badging.txt" | cut -d ' ' -f1)"
            echo "permissions_sha256=$(sha256sum "$evidence/permissions.txt" | cut -d ' ' -f1)"
            echo "signing_sha256=$(sha256sum "$evidence/signing.txt" | cut -d ' ' -f1)"
          } > /tmp/pandora-team-build/pandora-team-artifact-manifest.txt

      - name: Push exact validated candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload exact-source Android candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-team-android-${{ steps.candidate.outputs.sha }}
          path: |
            /tmp/pandora-team-build/build/app/outputs/flutter-apk/app-debug.apk
            /tmp/pandora-team-build/pandora-team-artifact-manifest.txt
            /tmp/pandora-team-build/android-package-evidence
          if-no-files-found: error
          retention-days: 30

# bootstrap retry: repaired pre-existing auth constructor
