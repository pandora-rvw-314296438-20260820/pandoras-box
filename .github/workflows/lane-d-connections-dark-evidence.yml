name: Lane D connections dark evidence
on:
  push:
    branches:
      - chatgpt/lane-d-polish-connections-v1
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Render Connections Obsidian evidence
        working-directory: apps/pandora-mobile
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter test --update-goldens test/goldens/owner_screens_visual_evidence_test.dart --plain-name "captures connections_healthy_porcelain_390x844"
          test -s build/owner-screen-evidence/connections_healthy_porcelain_390x844.png
          mkdir -p ../../docs/visual-evidence/lane-d/pr-903
          cp build/owner-screen-evidence/connections_healthy_porcelain_390x844.png ../../docs/visual-evidence/lane-d/pr-903/after.png
      - name: Commit evidence
        run: |
          set -euo pipefail
          git config user.name "pandora-lane-d-evidence"
          git config user.email "actions@users.noreply.github.com"
          git add apps/pandora-mobile/test/goldens/owner_screens/connections_healthy_porcelain_390x844.png docs/visual-evidence/lane-d/pr-903/after.png
          git diff --cached --quiet && exit 0
          git commit -m "test(connections): refresh Obsidian visual evidence"
          git push origin HEAD:chatgpt/lane-d-polish-connections-v1
