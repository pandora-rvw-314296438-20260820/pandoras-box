name: Security lockfile refresh

on:
  push:
    branches:
      - "security/vercel-node-5x-remediation-20260826"
    paths:
      - ".github/workflows/security-lockfile-refresh.yml"

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: security/vercel-node-5x-remediation-20260826

      - name: Install pinned Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Set controlled dependency targets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.devDependencies['@vercel/node'] = '5.10.2';
          pkg.overrides = { ...(pkg.overrides || {}), undici: '5.29.0' };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Regenerate npm lockfile without package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify resolved security targets in lockfile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = lock.packages || {};
          const version = (path) => packages[path]?.version || null;
          const assertExact = (path, expected) => {
            const actual = version(path);
            if (actual !== expected) throw new Error(`${path}: expected ${expected}, got ${actual}`);
          };
          const cmp = (a, b) => {
            const pa = a.split(/[.-]/).slice(0, 3).map(x => Number(x) || 0);
            const pb = b.split(/[.-]/).slice(0, 3).map(x => Number(x) || 0);
            for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pa[i] - pb[i];
            return 0;
          };
          const assertAllAtLeast = (name, minimum) => {
            const matches = Object.entries(packages).filter(([path, meta]) =>
              meta?.version && (path === `node_modules/${name}` || path.endsWith(`/node_modules/${name}`))
            );
            if (!matches.length) throw new Error(`No resolved ${name} package found`);
            for (const [path, meta] of matches) {
              if (cmp(meta.version, minimum) < 0) throw new Error(`${path}: ${meta.version} < ${minimum}`);
              console.log(`${path}=${meta.version}`);
            }
          };
          assertExact('node_modules/@vercel/node', '5.10.2');
          assertExact('node_modules/undici', '5.29.0');
          assertAllAtLeast('tar', '7.5.16');
          assertAllAtLeast('minimatch', '3.1.3');
          assertAllAtLeast('undici', '5.29.0');
          assertAllAtLeast('esbuild', '0.25.0');
          NODE

      - name: Reject all npm advisories
        run: npm audit --audit-level=low

      - name: Validate generated diff
        run: git diff --check -- package.json package-lock.json

      - name: Commit generated dependency remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pandora-security-bot"
          git config user.email "pandora-security-bot@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes generated"
            exit 1
          fi
          git commit -m "security: remediate Vercel build-chain dependencies"
          git push origin HEAD:security/vercel-node-5x-remediation-20260826
