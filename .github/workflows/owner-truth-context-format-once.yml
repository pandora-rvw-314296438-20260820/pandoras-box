name: Owner truth materialized formatter once
on:
  push:
    branches:
      - fix/owner-truth-status-20260828
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Materialize exact package context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create \
            --platforms=android,web \
            --org com.banataosystems \
            --project-name pandora_mobile \
            .
          cp -R ../apps/pandora-mobile/platform/android/. ./android/
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp -R ../apps/pandora-mobile/platform ./platform
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          dart format lib/core/data/owner_projection.dart lib/features/simple/systems_screen.dart test/core/owner_projection_test.dart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-truth-context-formatted
          path: |
            .pandora-mobile-build/lib/core/data/owner_projection.dart
            .pandora-mobile-build/lib/features/simple/systems_screen.dart
            .pandora-mobile-build/test/core/owner_projection_test.dart
          if-no-files-found: error
          retention-days: 1
