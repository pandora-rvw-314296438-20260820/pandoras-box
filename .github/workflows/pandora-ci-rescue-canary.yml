name: Pandora CI Rescue Canary

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deterministic-canary-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Rescue repaired the deterministic canary
        shell: bash
        run: |
          echo "PANDORA_CI_RESCUE_CANARY repaired"
          exit 0
