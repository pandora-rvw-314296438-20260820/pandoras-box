name: Pandora CI Rescue Canary

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deterministic-canary-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Fail intentionally for unattended Rescue acceptance
        shell: bash
        run: |
          echo "::error::PANDORA_CI_RESCUE_CANARY unattended acceptance failure"
          echo "Rescue must repair this exact SHA without touching main."
          exit 1
