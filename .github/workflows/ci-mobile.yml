        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/{print $2; exit}' pubspec.yaml)" = "$EXPECTED_APP_VERSION"
          flutter build apk --release             --target=lib/main_eurofish.dart             --target-platform=android-arm64             --dart-define=PANDORA_SOURCE_REVISION="$SOURCE_SHA"             --dart-define=PANDORA_APP_VERSION="$EXPECTED_APP_VERSION"

      - name: Verify Euro-Fish package, native ABI, signing, and model separation
        shell: bash
        run: |
          set -euo pipefail
          apk=.eurofish-android-build/build/app/outputs/flutter-apk/app-release.apk
          evidence=.eurofish-android-build/eurofish-package-evidence
          mkdir -p "$evidence"

          aapt="${ANDROID_HOME:?}/build-tools/36.0.0/aapt"
          apksigner="${ANDROID_HOME:?}/build-tools/36.0.0/apksigner"

          "$aapt" dump badging "$apk" > "$evidence/badging.txt"
          "$aapt" dump permissions "$apk" > "$evidence/permissions.txt"
          "$apksigner" verify --verbose --print-certs "$apk" > "$evidence/signing.txt"
          unzip -l "$apk" > "$evidence/apk-files.txt"

          grep -Fq "package: name='$EXPECTED_PACKAGE'" "$evidence/badging.txt"
          grep -Fq "application-label:'$EXPECTED_LABEL'" "$evidence/badging.txt"
          grep -Fq "launchable-activity: name='$EXPECTED_PACKAGE.MainActivity'" "$evidence/badging.txt"
          expected_version_name="${EXPECTED_APP_VERSION%%+*}"
          expected_version_code="${EXPECTED_APP_VERSION##*+}"
          grep -Fq "versionCode='$expected_version_code'" "$evidence/badging.txt"
          grep -Fq "versionName='$expected_version_name'" "$evidence/badging.txt"

          grep -Fq 'lib/arm64-v8a/' "$evidence/apk-files.txt"
          ! grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/' "$evidence/apk-files.txt"
          ! grep -Eiq '\.gguf($|[[:space:]])' "$evidence/apk-files.txt"

          if grep -Eiq             'ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_|CAMERA|RECORD_AUDIO|BLUETOOTH_(SCAN|CONNECT|ADVERTISE)|QUERY_ALL_PACKAGES|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW'             "$evidence/permissions.txt"; then
            echo 'Unexpected sensitive Android permission detected.' >&2
            exit 1
          fi

      - name: Bind exact APK evidence
        shell: bash
        run: |
          set -euo pipefail
          source_apk=.eurofish-android-build/build/app/outputs/flutter-apk/app-release.apk
          final_apk=".eurofish-android-build/$APK_FILENAME"
          cp "$source_apk" "$final_apk"

          manifest=.eurofish-android-build/Euro-Fish-Pandora-Enterprise.manifest.txt
          {
            echo "source_sha=$SOURCE_SHA"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "flutter_version=$FLUTTER_VERSION"
            echo "app_version=$EXPECTED_APP_VERSION"
            echo "android_package=$EXPECTED_PACKAGE"
            echo "application_label=$EXPECTED_LABEL"
            echo "dart_entrypoint=lib/main_eurofish.dart"
            echo "llama_cpp_sha=$LLAMA_CPP_SHA"
            echo "recommended_local_model=$LOCAL_MODEL_NAME"
            echo "recommended_local_model_sha256=$LOCAL_MODEL_SHA256"
            echo "local_ai_model_bundled=false"
            echo "android_platform=android-36"
            echo "android_build_tools=36.0.0"
            echo "android_ndk=29.0.13113456"
            echo "cmake_version=3.31.6"
            echo "target_abi=arm64-v8a"
            echo "build_mode=release"
            echo "apk_filename=$APK_FILENAME"
            echo "artifact_class=$ARTIFACT_CLASS"
            echo "production_release=$PRODUCTION_RELEASE"
            echo "distribution_scope=$DISTRIBUTION_SCOPE"
            echo "production_signing_verified=false"
            echo "install_authority=none"
            echo "apk_sha256=$(sha256sum "$final_apk" | cut -d ' ' -f1)"
            echo "apk_size_bytes=$(stat -c '%s' "$final_apk")"
            echo "signing_evidence_sha256=$(sha256sum .eurofish-android-build/eurofish-package-evidence/signing.txt | cut -d ' ' -f1)"
            echo "badging_evidence_sha256=$(sha256sum .eurofish-android-build/eurofish-package-evidence/badging.txt | cut -d ' ' -f1)"
            echo "physical_device_verified=false"
            echo "offline_qwen_acceptance_verified=false"
          } > "$manifest"

          cat "$manifest"
          test "$(sha256sum "$final_apk" | cut -d ' ' -f1)" =             "$(grep '^apk_sha256=' "$manifest" | cut -d= -f2-)"

      - name: Enforce validation-only distribution boundary
        shell: bash
        run: |
          set -euo pipefail
          manifest=.eurofish-android-build/Euro-Fish-Pandora-Enterprise.manifest.txt
          test "$(grep '^artifact_class=' "$manifest")" = 'artifact_class=validation-candidate'
          test "$(grep '^production_release=' "$manifest")" = 'production_release=false'
          test "$(grep '^distribution_scope=' "$manifest")" = 'distribution_scope=github-actions-validation-only'
          test "$(grep '^production_signing_verified=' "$manifest")" = 'production_signing_verified=false'
          test "$(grep '^install_authority=' "$manifest")" = 'install_authority=none'
          test "$(grep '^physical_device_verified=' "$manifest")" = 'physical_device_verified=false'

      - name: Upload validation-only Euro-Fish APK and evidence
        if: ${{ github.event_name != 'pull_request' }}
        id: upload_eurofish_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: eurofish-pandora-validation-${{ env.SOURCE_SHA }}
          path: |
            .eurofish-android-build/Euro-Fish-Pandora-Enterprise.apk
            .eurofish-android-build/Euro-Fish-Pandora-Enterprise.manifest.txt
            .eurofish-android-build/flutter-analyze.log
            .eurofish-android-build/eurofish-package-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Publish validation-only provider locator
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload_eurofish_apk.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_eurofish_apk.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          manifest=.eurofish-android-build/Euro-Fish-Pandora-Enterprise.manifest.txt
          apk_sha="$(grep '^apk_sha256=' "$manifest" | cut -d= -f2-)"
          apk_size="$(grep '^apk_size_bytes=' "$manifest" | cut -d= -f2-)"
          printf 'EUROFISH_PANDORA_ANDROID_VALIDATION_RECEIPT source_sha=%s apk_sha256=%s apk_size_bytes=%s package=%s artifact_class=%s production_release=%s distribution_scope=%s artifact_id=%s artifact_digest=%s\n'             "$SOURCE_SHA" "$apk_sha" "$apk_size" "$EXPECTED_PACKAGE" "$ARTIFACT_CLASS" "$PRODUCTION_RELEASE" "$DISTRIBUTION_SCOPE" "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
          {
            echo '### Euro-Fish Pandora Enterprise validation-only APK'
            echo
            echo "- Source SHA: `$SOURCE_SHA`"
            echo "- Artifact class: `$ARTIFACT_CLASS`"
            echo "- Production release: `$PRODUCTION_RELEASE`"
            echo "- Distribution scope: `$DISTRIBUTION_SCOPE`"
            echo "- Package: `$EXPECTED_PACKAGE`"
            echo "- APK: `$APK_FILENAME`"
            echo "- APK SHA-256: `$apk_sha`"
            echo "- APK size: `$apk_size` bytes"
            echo "- Artifact ID: `$ARTIFACT_ID`"
            echo "- Artifact digest: `sha256:$ARTIFACT_DIGEST`"
          } >> "$GITHUB_STEP_SUMMARY"


  mob_plp_verify-plp-android:
    needs: detect_scopes
    if: ${{ needs.detect_scopes.outputs.plp_pandora_enterprise_android == 'true' }}
    name: Exact source / PLP native Android
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      SOURCE_SHA: ${{ github.sha }}
      FLUTTER_VERSION: '3.47.0'
      EXPECTED_APP_VERSION: '0.4.0-rc.14+21'
      EXPECTED_PACKAGE: 'com.banataosystems.pandora.plp'
      EXPECTED_LABEL: 'PLP Pandora Enterprise'
      LLAMA_CPP_SHA: '44be98f057e9f9902a8ee12630e181c7f8ec2953'
      LOCAL_MODEL_SHA256: '1571ec5115bcfed4b4327fc27b5f44ea284806caf5331eef89326191c9b031d6'
      LOCAL_MODEL_NAME: 'Qwen3-4B-Instruct-2507-Q4_K_M.gguf'
      APK_FILENAME: 'PLP-Pandora-Enterprise.apk'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source and PLP isolation contracts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -m unittest discover             -s apps/pandora-mobile/tool             -p 'test_*.py'
          test -f apps/pandora-mobile/lib/main_plp.dart
          ! grep -R -F 'PANDORA_ENTERPRISE_WORKSPACE'             apps/pandora-mobile/lib/main_plp.dart             apps/pandora-mobile/lib/app/plp_enterprise_app.dart             apps/pandora-mobile/lib/app/plp_enterprise_shell.dart             apps/pandora-mobile/lib/features/auth/plp_auth_gate.dart

      - name: Scan PLP mobile source for private-key literals
        shell: bash
        run: >-
          bash apps/pandora-mobile/tool/check_private_key_literals.sh
          apps/pandora-mobile
          .github/workflows/ci-mobile.yml

      - name: Install pinned JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"             'platforms;android-36'             'build-tools;36.0.0'             'ndk;29.0.13113456'             'cmake;3.31.6'

      - name: Install Vulkan build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y glslc libvulkan-dev spirv-headers
          test -f /usr/include/vulkan/vulkan.hpp
          test -f /usr/include/spirv/unified1/spirv.hpp
          mkdir -p "$RUNNER_TEMP/pandora-vulkan-headers"
          cp -R /usr/include/vulkan "$RUNNER_TEMP/pandora-vulkan-headers/vulkan"
          cp -R /usr/include/spirv "$RUNNER_TEMP/pandora-vulkan-headers/spirv"
          echo "PANDORA_VULKAN_HEADERS_DIR=$RUNNER_TEMP/pandora-vulkan-headers" >> "$GITHUB_ENV"
          spirv_config=$(find /usr -type f -name SPIRV-HeadersConfig.cmake -print -quit)
          test -n "$spirv_config"
          echo "PANDORA_SPIRV_HEADERS_DIR=$(dirname "$spirv_config")" >> "$GITHUB_ENV"

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Materialize dedicated PLP Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .plp-android-build
          mkdir .plp-android-build
          cd .plp-android-build

          flutter create             --platforms=android             --org com.banataosystems             --project-name pandora_mobile             .

          cp -R ../apps/pandora-mobile/platform/android/. ./android/

          git init -q android/llama.cpp
          git -C android/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C android/llama.cpp fetch --depth 1 origin "$LLAMA_CPP_SHA"
          git -C android/llama.cpp checkout -q --detach FETCH_HEAD
          test "$(git -C android/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_SHA"

          mkdir -p android/app/src/main/kotlin/com/arm/aichat/internal
          cp android/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/AiChat.kt             android/app/src/main/kotlin/com/arm/aichat/AiChat.kt
          cp android/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt             android/app/src/main/kotlin/com/arm/aichat/InferenceEngine.kt
          cp android/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt             android/app/src/main/kotlin/com/arm/aichat/internal/InferenceEngineImpl.kt
          python3 ../apps/pandora-mobile/tool/patch_inference_engine_android.py             android/app/src/main/kotlin/com/arm/aichat/internal/InferenceEngineImpl.kt             android/app/src/main/kotlin/com/arm/aichat/InferenceEngine.kt

          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp -R ../apps/pandora-mobile/platform ./platform
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml

          python3 ../apps/pandora-mobile/tool/configure_validation_android.py             android/app/src/main/AndroidManifest.xml
          python3 ../apps/pandora-mobile/tool/configure_local_ai_android.py             android/app/build.gradle.kts             android/gradle.properties
          python3 ../apps/pandora-mobile/tool/configure_plp_android.py             android/app/build.gradle.kts             android/app/src/main/AndroidManifest.xml             android/app/src/main/kotlin

          grep -Fq "applicationId = \"$EXPECTED_PACKAGE\"" android/app/build.gradle.kts
          grep -Fq "namespace = \"$EXPECTED_PACKAGE\"" android/app/build.gradle.kts
          grep -Fq "android:label=\"$EXPECTED_LABEL\"" android/app/src/main/AndroidManifest.xml
          ! grep -R -F 'com.banataosystems.pandora_mobile'             android/app/build.gradle.kts             android/app/src/main/AndroidManifest.xml             android/app/src/main/kotlin

      - name: Resolve exact lockfile
        working-directory: .plp-android-build
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock

      - name: Analyze dedicated PLP source
        working-directory: .plp-android-build
        shell: bash
        run: |
          set -euo pipefail
          set +e
          flutter analyze > flutter-analyze.log 2>&1
          ANALYZE_EXIT=$?
          set -e
          cat flutter-analyze.log
          if grep -Eq '^[[:space:]]*error[[:space:]]+•' flutter-analyze.log; then
            exit 31
          fi
          if [[ "$ANALYZE_EXIT" -ne 0 ]] && ! grep -Fq 'issues found.' flutter-analyze.log; then
            exit "$ANALYZE_EXIT"
          fi

      - name: Run PLP architecture and UI tests
        working-directory: .plp-android-build
        shell: bash
        run: |
          set -euo pipefail
          flutter test --reporter expanded             test/core/local_ai/plp_local_router_test.dart             test/features/enterprise/plp/local_ai/plp_chat_fallback_test.dart             test/features/enterprise/plp_staff_task_action_test.dart             test/features/enterprise/plp_enterprise_home_test.dart             test/app/plp_owner_journey_acceptance_test.dart             test/features/enterprise/plp_resort_operational_screens_test.dart             test/features/enterprise/plp_resort_transaction_screens_test.dart             test/features/enterprise/plp_team_management_screen_test.dart             test/features/enterprise/plp_guests_screen_test.dart             test/features/enterprise/plp_workspace_layout_test.dart             test/features/enterprise/enterprise_vision_demo_contract_test.dart             test/features/operations/operations_room_test.dart             test/app/plp_navigation_drawer_test.dart

      - name: Build exact PLP native APK
        working-directory: .plp-android-build
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/{print $2; exit}' pubspec.yaml)" = "$EXPECTED_APP_VERSION"
          flutter build apk --release             --target=lib/main_plp.dart             --target-platform=android-arm64             --dart-define=PANDORA_SOURCE_REVISION="$SOURCE_SHA"             --dart-define=PANDORA_APP_VERSION="$EXPECTED_APP_VERSION"

      - name: Verify PLP package, native ABI, signing, and model separation
        shell: bash
        run: |
          set -euo pipefail
          apk=.plp-android-build/build/app/outputs/flutter-apk/app-release.apk
          evidence=.plp-android-build/plp-package-evidence
          mkdir -p "$evidence"

          aapt="${ANDROID_HOME:?}/build-tools/36.0.0/aapt"
          apksigner="${ANDROID_HOME:?}/build-tools/36.0.0/apksigner"

          "$aapt" dump badging "$apk" > "$evidence/badging.txt"
          "$aapt" dump permissions "$apk" > "$evidence/permissions.txt"
          "$apksigner" verify --verbose --print-certs "$apk" > "$evidence/signing.txt"
          unzip -l "$apk" > "$evidence/apk-files.txt"

          grep -Fq "package: name='$EXPECTED_PACKAGE'" "$evidence/badging.txt"
          grep -Fq "application-label:'$EXPECTED_LABEL'" "$evidence/badging.txt"
          grep -Fq "launchable-activity: name='$EXPECTED_PACKAGE.MainActivity'" "$evidence/badging.txt"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > "$evidence/manifest-xmltree.txt"
          grep -Fq 'android.intent.category.LAUNCHER' "$evidence/manifest-xmltree.txt"
          ! grep -Fq 'android.intent.category.HOME' "$evidence/manifest-xmltree.txt"
          expected_version_name="${EXPECTED_APP_VERSION%%+*}"
          expected_version_code="${EXPECTED_APP_VERSION##*+}"
          grep -Fq "versionCode='$expected_version_code'" "$evidence/badging.txt"
          grep -Fq "versionName='$expected_version_name'" "$evidence/badging.txt"

          grep -Fq 'lib/arm64-v8a/' "$evidence/apk-files.txt"
          ! grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/' "$evidence/apk-files.txt"
          ! grep -Eiq '\.gguf($|[[:space:]])' "$evidence/apk-files.txt"

          if grep -Eiq             'ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_|CAMERA|RECORD_AUDIO|BLUETOOTH_(SCAN|CONNECT|ADVERTISE)|QUERY_ALL_PACKAGES|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW'             "$evidence/permissions.txt"; then
            echo 'Unexpected sensitive Android permission detected.' >&2
            exit 1
          fi

      - name: Preserve arm64 release and build exact-source x86_64 emulator candidate
        working-directory: .plp-android-build
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk \
            PLP-Pandora-Enterprise-arm64.apk
          test "$(sha256sum PLP-Pandora-Enterprise-arm64.apk | cut -d ' ' -f1)" = \
            "$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d ' ' -f1)"

          # The production APK is intentionally arm64-only with local AI.
          # Emulator acceptance uses the same Dart/UI/business source but
          # disables the arm64-only native local-AI bridge in this disposable
          # x86_64 project.
          python3 ../apps/pandora-mobile/tool/configure_plp_emulator_android.py \
            android/app/build.gradle.kts \
            android/app/src/main/kotlin
          grep -Fq 'abiFilters += "x86_64"' android/app/build.gradle.kts
          ! grep -Fq 'abiFilters += "arm64-v8a"' android/app/build.gradle.kts
          ! grep -Fq 'externalNativeBuild {' android/app/build.gradle.kts
          flutter clean

          flutter build apk --release \
            --target=lib/main_plp.dart \
            --target-platform=android-x64 \
            --dart-define=PANDORA_SOURCE_REVISION="$SOURCE_SHA" \
            --dart-define=PANDORA_APP_VERSION="$EXPECTED_APP_VERSION"

          cp build/app/outputs/flutter-apk/app-release.apk \
            PLP-Pandora-Enterprise-emulator-x86_64.apk
          unzip -l PLP-Pandora-Enterprise-emulator-x86_64.apk \
            > plp-emulator-apk-files.txt
          grep -Fq 'lib/x86_64/' plp-emulator-apk-files.txt
          ! grep -Fq 'lib/arm64-v8a/' plp-emulator-apk-files.txt
          ! grep -Fq 'libai-chat.so' plp-emulator-apk-files.txt

      - name: Build and verify native UI evidence capture
        shell: bash
        run: |
          set -euo pipefail
          capture=apps/pandora-mobile/tool/android_ui_capture
          evidence=.plp-android-build/plp-emulator-evidence
          mkdir -p "$RUNNER_TEMP/plp-capture-tests" "$evidence"
          javac --release 8 -d "$RUNNER_TEMP/plp-capture-tests" \
            "$capture/src/com/banataosystems/pandora/uicapture/CaptureXml.java" \
            "$capture/test/CaptureXmlTest.java"
          java -cp "$RUNNER_TEMP/plp-capture-tests" CaptureXmlTest
          # The inspector targets its own package and has its own disposable
          # debug identity. Do not assume or reuse PLP's signing keystore.
          capture_key_dir="$(mktemp -d "${RUNNER_TEMP:?}/pandora-ui-capture-key.XXXXXX")"
          trap 'rm -rf -- "$capture_key_dir"' EXIT
          umask 077
          capture_keystore="$capture_key_dir/inspector-debug.jks"
          export UI_CAPTURE_KEY_ALIAS=androiddebugkey
          export UI_CAPTURE_STORE_PASSWORD=android
          export UI_CAPTURE_KEY_PASSWORD=android
          if ! keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$capture_keystore" -alias "$UI_CAPTURE_KEY_ALIAS" \
            -storepass:env UI_CAPTURE_STORE_PASSWORD \
            -keypass:env UI_CAPTURE_KEY_PASSWORD \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Pandora CI UI Capture,O=Pandora CI,C=PH' \
            > "$capture_key_dir/keytool.log" 2>&1; then
            echo 'Could not generate the temporary inspector debug key.' >&2
            exit 1
          fi
          bash "$capture/build.sh" "$RUNNER_TEMP/plp-ui-capture" \
            "$capture_keystore"
          sha256sum "$RUNNER_TEMP/plp-ui-capture/pandora-ui-capture.apk" \
            > "$evidence/ui-capture-sha256.txt"

      - name: Install Android emulator system image
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'

      - name: Boot exact-APK acceptance emulator
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          evidence=.plp-android-build/plp-emulator-evidence
          mkdir -p "$evidence"
          boot_log="$evidence/emulator-boot.log"
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          serial=emulator-5554
          # SDK tools and the emulator can otherwise use different default
          # user directories on the hosted runner. Share an explicit AVD home.
          export ANDROID_AVD_HOME="${RUNNER_TEMP:?}/pandora-plp-owner-avd"
          export ANDROID_USER_HOME="${RUNNER_TEMP}/pandora-plp-android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          deadline=$((SECONDS + 420))
          record_boot_failure() {
            boot_status=$?
            if (( boot_status != 0 )); then
              echo "Emulator startup failed (exit $boot_status)." >&2
              tail -n 120 "$boot_log" >&2 || true
            fi
          }
          trap record_boot_failure EXIT

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            accel='-accel on'
          else
            accel='-accel off'
          fi

          echo no | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            create avd \
            --force \
            --name plp-owner-acceptance \
            --path "$ANDROID_AVD_HOME/plp-owner-acceptance.avd" \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device 'pixel_7'

          test -s "$ANDROID_AVD_HOME/plp-owner-acceptance.ini"
          timeout 15s "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds \
            > "$evidence/avd-list.txt"
          grep -Fxq 'plp-owner-acceptance' "$evidence/avd-list.txt"
          timeout 20s "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check \
            > "$evidence/emulator-acceleration.txt" 2>&1 || true
          timeout 15s "$adb" start-server
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd plp-owner-acceptance \
            -port 5554 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader \
            -memory 2048 \
            -cores 2 \
            $accel \
            > "$boot_log" 2>&1 < /dev/null &
          emulator_pid=$!

          # ADB may never discover an emulator that exits during startup. Bound
          # every readiness call and check the process before waiting again.
          while true; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo 'Emulator process exited before Android became ready.' >&2
              exit 40
            fi
            if (( SECONDS >= deadline )); then
              echo 'Android boot or Package Manager did not become ready within 420 seconds.' >&2
              exit 41
            fi

            boot_completed="$(timeout 5s "$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$boot_completed" == "1" ]] && \
              timeout 10s "$adb" -s "$serial" shell cmd package path android \
                > "$evidence/package-manager-ready.txt" 2>/dev/null && \
              grep -q '^package:' "$evidence/package-manager-ready.txt"; then
              break
            fi
            sleep 2
          done

          timeout 10s "$adb" -s "$serial" shell settings put global window_animation_scale 0
          timeout 10s "$adb" -s "$serial" shell settings put global transition_animation_scale 0
          timeout 10s "$adb" -s "$serial" shell settings put global animator_duration_scale 0

      - name: Exercise installed PLP APK lifecycle and unauthenticated client flow
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          apk=.plp-android-build/PLP-Pandora-Enterprise-emulator-x86_64.apk
          pkg="$EXPECTED_PACKAGE"
          evidence=.plp-android-build/plp-emulator-evidence
          mkdir -p "$evidence"
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          serial=emulator-5554
          adb_call() { timeout 20s "$adb" -s "$serial" "$@"; }
          capture_ui() {
            python3 apps/pandora-mobile/tool/capture_plp_android_ui.py \
              --adb "$adb" --serial "$serial" --phase "$1" --output "$2"
          }
          wait_for_drawn_ui() {
            python3 apps/pandora-mobile/tool/wait_for_plp_android_ready.py \
              --adb "$adb" --serial "$serial" --output "$1"
          }

          timeout 120s "$adb" -s "$serial" install -r "$apk"
          timeout 30s "$adb" -s "$serial" install -r \
            "$RUNNER_TEMP/plp-ui-capture/pandora-ui-capture.apk"
          adb_call logcat -c
          adb_call shell am force-stop "$pkg"
          adb_call shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 4

          pid="$(adb_call shell pidof "$pkg" | tr -d '\r')"
          test -n "$pid"
          # A resumed activity can still be covered by its launch splash.
          # Preserve that observation, then require a stably drawn PLP window.
          adb_call exec-out screencap -p > "$evidence/launch.png"
          wait_for_drawn_ui "$evidence/launch-readiness.json"
          adb_call exec-out screencap -p > "$evidence/sign-in.png"
          capture_ui sign-in "$evidence/sign-in.xml" > "$evidence/sign-in-tap.txt"
          # Recheck after the separate native capture session has ended.
          wait_for_drawn_ui "$evidence/pre-submit-readiness.json"

          # One empty submit; exact native validation remains mandatory.
          read -r tap_x tap_y < "$evidence/sign-in-tap.txt"
          adb_call shell input tap "$tap_x" "$tap_y"
          sleep 1
          adb_call exec-out screencap -p > "$evidence/validation.png"
          capture_ui validation "$evidence/validation.xml"

          # Background/foreground and rotations must not crash the process.
          adb_call shell input keyevent KEYCODE_HOME
          sleep 1
          adb_call shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 2
          test -n "$(adb_call shell pidof "$pkg" | tr -d '\r')"

          adb_call shell settings put system accelerometer_rotation 0
          for rotation in 1 0 3 0; do
            adb_call shell settings put system user_rotation "$rotation"
            sleep 1
            test -n "$(adb_call shell pidof "$pkg" | tr -d '\r')"
          done

          # This installed-app smoke is unauthenticated. A process restart must
          # therefore remain on sign-in and must not invent a session.
          adb_call shell am force-stop "$pkg"
          adb_call shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1 >/dev/null
          wait_for_drawn_ui "$evidence/restart-readiness.json"
          adb_call exec-out screencap -p > "$evidence/restart.png"
          capture_ui restart "$evidence/restart.xml"

          adb_call shell dumpsys package "$pkg" > "$evidence/package.txt"
          if grep -Eq 'android.permission.(CALL_PHONE|SEND_SMS|READ_CONTACTS|READ_CALENDAR|WRITE_CALENDAR|POST_NOTIFICATIONS): granted=true' "$evidence/package.txt"; then
            echo 'Dangerous PLP runtime permission was granted without an owner action.' >&2
            exit 42
          fi

          adb_call logcat -d -b crash > "$evidence/crash-buffer.txt"
          if grep -Fq "$pkg" "$evidence/crash-buffer.txt"; then
            cat "$evidence/crash-buffer.txt" >&2
            exit 43
          fi

          {
            echo "source_sha=$SOURCE_SHA"
            echo "emulator_apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f1)"
            echo "emulator_target_abi=x86_64"
            echo "package=$pkg"
            echo "emulator_api=35"
            echo "launch_verified=true"
            echo "sign_in_semantics_verified=true"
            echo "native_hint_capture_verified=true"
            echo "drawn_window_readiness_verified=true"
            echo "empty_submit_validation_verified=true"
            echo "background_foreground_verified=true"
            echo "rotation_verified=true"
            echo "process_restart_verified=true"
            echo "unauthenticated_restart_returns_to_sign_in=true"
            echo "authenticated_session_restore_tested=false"
            echo "unexpected_runtime_permission_grant=false"
            echo "crash_buffer_clear=true"
          } > "$evidence/acceptance.txt"

      - name: Upload installed-app acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: plp-installed-app-acceptance-${{ env.SOURCE_SHA }}
          path: .plp-android-build/plp-emulator-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Bind exact APK evidence
        shell: bash
        run: |
          set -euo pipefail
          source_apk=.plp-android-build/PLP-Pandora-Enterprise-arm64.apk
          final_apk=".plp-android-build/$APK_FILENAME"
          cp "$source_apk" "$final_apk"

          manifest=.plp-android-build/PLP-Pandora-Enterprise.manifest.txt
          {
            echo "source_sha=$SOURCE_SHA"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "flutter_version=$FLUTTER_VERSION"
            echo "app_version=$EXPECTED_APP_VERSION"
            echo "android_package=$EXPECTED_PACKAGE"
            echo "application_label=$EXPECTED_LABEL"
            echo "dart_entrypoint=lib/main_plp.dart"
            echo "llama_cpp_sha=$LLAMA_CPP_SHA"
            echo "recommended_local_model=$LOCAL_MODEL_NAME"
            echo "recommended_local_model_sha256=$LOCAL_MODEL_SHA256"
            echo "accepted_local_model_name=$LOCAL_MODEL_NAME"
            echo "accepted_local_model_sha256=$LOCAL_MODEL_SHA256"
            echo "local_ai_model_bundled=false"
            echo "android_platform=android-36"
            echo "android_build_tools=36.0.0"
            echo "android_ndk=29.0.13113456"
            echo "cmake_version=3.31.6"
            echo "target_abi=arm64-v8a"
            echo "build_mode=release"
            echo "artifact_class=validation-candidate"
            echo "production_release=false"
            echo "production_signer_verified=false"
            echo "apk_filename=$APK_FILENAME"
            echo "apk_sha256=$(sha256sum "$final_apk" | cut -d ' ' -f1)"
            echo "apk_size_bytes=$(stat -c '%s' "$final_apk")"
            echo "signing_evidence_sha256=$(sha256sum .plp-android-build/plp-package-evidence/signing.txt | cut -d ' ' -f1)"
            echo "badging_evidence_sha256=$(sha256sum .plp-android-build/plp-package-evidence/badging.txt | cut -d ' ' -f1)"
            echo "physical_device_verified=false"
            echo "offline_qwen_acceptance_verified=false"
          } > "$manifest"

          cat "$manifest"
          test "$(sha256sum "$final_apk" | cut -d ' ' -f1)" =             "$(grep '^apk_sha256=' "$manifest" | cut -d= -f2-)"

      - name: Upload exact PLP APK and evidence
        id: upload_plp_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: plp-pandora-enterprise-${{ env.SOURCE_SHA }}
          path: |
            .plp-android-build/PLP-Pandora-Enterprise.apk
            .plp-android-build/PLP-Pandora-Enterprise.manifest.txt
            .plp-android-build/flutter-analyze.log
            .plp-android-build/plp-package-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Publish provider locator
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload_plp_apk.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_plp_apk.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          manifest=.plp-android-build/PLP-Pandora-Enterprise.manifest.txt
          apk_sha="$(grep '^apk_sha256=' "$manifest" | cut -d= -f2-)"
          apk_size="$(grep '^apk_size_bytes=' "$manifest" | cut -d= -f2-)"
          printf 'PLP_PANDORA_ANDROID_RECEIPT source_sha=%s apk_sha256=%s apk_size_bytes=%s package=%s artifact_id=%s artifact_digest=%s\n'             "$SOURCE_SHA" "$apk_sha" "$apk_size" "$EXPECTED_PACKAGE" "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
          {
            echo '### PLP Pandora Enterprise APK'
            echo
            echo "- Source SHA: `$SOURCE_SHA`"
            echo "- Package: `$EXPECTED_PACKAGE`"
            echo "- APK: `$APK_FILENAME`"
            echo "- APK SHA-256: `$apk_sha`"
            echo "- APK size: `$apk_size` bytes"
            echo "- Artifact ID: `$ARTIFACT_ID`"
            echo "- Artifact digest: `sha256:$ARTIFACT_DIGEST`"
          } >> "$GITHUB_STEP_SUMMARY"

